package:
  name: microcode
  version: 20260512
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://github.com/intel/Intel-Linux-Processor-Microcode-Data-Files/archive/refs/tags/microcode-20260512.tar.gz
    sha256: 5a07ce745d0bd8b360a4713564d46d5e38be797316a52abedaff0761e1b02370
    md5: c15cf8014a2c179d94c290a230dd4558

prepare: |
  mkdir -pv initrd/kernel/x86/microcode

build: |
  ucode=$(printf "%02x-%02x-%02x\n" `lscpu | grep -e "CPU family:" -e "Model:" -e "Stepping:" | cut -d: -f2`) &&
  echo $ucode;
  cd initrd &&
  cp -v ../intel-ucode/${ucode} kernel/x86/microcode/GenuineIntel.bin &&
  find kernel | cpio -o -H newc > ../intel-microcode.cpio

install: |
  install -vm755 intel-microcode.cpio /boot/intel-microcode.cpio

required:
  - libarchive
