description: "The Linux Kernel"

package:
  name: linux
  version: 7.1.3
  rel: 1
  archive: false
  delete: false

sources:
  - url: https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.3.tar.xz
    sha256: be41c068e88f5242a19bccdbffbe077b18c47b45f627e2325504b4fab79dd1dc
    md5: bf2d36739dc948b9c5d923a238e150c1

prepare: |
  make mrproper;
  zcat /proc/config.gz > .config &&
  make olddefconfig

build: |
  make &&
  make modules_install

install: |
  cp -iv arch/x86/boot/bzImage /boot/vmlinuz-${PKGVER}-zlfs;
  cp -iv System.map /boot/System.map-${PKGVER};
  cp -iv .config /boot/config-${PKGVER}
