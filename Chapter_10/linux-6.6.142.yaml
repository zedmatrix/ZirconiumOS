description: "The Linux Kernel"

package:
  name: linux
  version: 6.6.142
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.6.142.tar.xz
    sha256: b2f6607a75cd27b2e368cf2d25e1637e1e0da9dfed4cda536658879eee6f2b70
    md5: f7e15ea578e348863661b05d4cccba29

prepare: |
  make mrproper;
  zcat /proc/config.gz > .config;
  make olddefconfig

build: |
  make;
  make modules_install

install: |
  cp -iv arch/x86/boot/bzImage /boot/vmlinuz-${PKGVER}-zlfs;
  cp -iv System.map /boot/System.map-${PKGVER};
  cp -iv .config /boot/config-${PKGVER}
