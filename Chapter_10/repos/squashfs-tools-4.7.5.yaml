description: "Tools for squashfs, a highly compressed read-only filesystem for Linux"

package:
  name: squashfs-tools
  version: 4.7.5
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://github.com/plougher/squashfs-tools/archive/4.7.5/squashfs-tools-4.7.5.tar.gz
    sha256: 547b7b7f4d2e44bf91b6fc554664850c69563701deab9fd9cd7e21f694c88ea6
    md5: 183807a29b969d8e3a1cd27f09fe8179

build: |
  cd squashfs-tools
  make GZIP_SUPPORT=1 LZ4_SUPPORT=1 LZMA_XZ_SUPPORT=1 \
    LZO_SUPPORT=0 XATTR_SUPPORT=1 XZ_SUPPORT=1 ZSTD_SUPPORT=1

install: |
  cd squashfs-tools
  make INSTALL_PREFIX=/usr USE_PREBUILT_MANPAGES=y \
    GZIP_SUPPORT=1 LZ4_SUPPORT=1 LZMA_XZ_SUPPORT=1 \
    LZO_SUPPORT=1 XATTR_SUPPORT=1 XZ_SUPPORT=1 ZSTD_SUPPORT=1 install

required:
  - gzip
  - lz4
  - xz
  - zstd
  - zlib

optional:
  - lzo
