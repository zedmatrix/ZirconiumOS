description: "The Linux Kernel"

package:
  name: linux
  version: 7.1.5
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.5.tar.xz
    sha256: 22a0196b3cbcdf34dc27b77561f4d040585fd3447edc9ab3531a1ac79e3041e7
    md5: 75f719d50ea10e0bb623a95f468600cb

prepare: |
  make mrproper;
  zcat /proc/config.gz > .config &&
  make olddefconfig

build: |
  make;
  make modules_install

install: |
  cp -iv arch/x86/boot/bzImage /boot/vmlinuz-${PKGVER}-zlfs;
  cp -iv System.map /boot/System.map-${PKGVER};
  cp -iv .config /boot/config-${PKGVER}
