description: "Git is a free and open source, distributed version control system"

package:
  name: git
  version: 2.54.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://www.kernel.org/pub/software/scm/git/git-2.54.0.tar.xz
    sha256: f689162364c10de79ef89aa8dbf48731eb057e34edbbd20aca510ce0154681a3
    md5: eb1137f556bd67cb4cea974275e51297
  - url: https://www.kernel.org/pub/software/scm/git/git-manpages-2.54.0.tar.xz
    sha256: 292062d18f3a215213ea8317ed22b94f02ad9572520b9293164d7db3eb888953
    md5: 7b7733b3d7cb066f93f26ebb6c6b631b
  - url: https://www.kernel.org/pub/software/scm/git/git-htmldocs-2.54.0.tar.xz
    sha256: 7ff72bfdfed4f20563f34416cf27614fb9c35bfad590db0062f2a0a9636514e4
    md5: 9350ea25146375eae9827eda025e5454

prepare: |
  ./configure --prefix=/usr --with-gitconfig=/etc/gitconfig \
    --with-libpcre2 --with-python=python3

build: |
  make

check: |
  GIT_UNZIP=nonexist make test -k |& tee ../test.log
  grep '^not ok' ../test.log | grep -v TODO || true

install: |
  make perllibdir=/usr/lib/perl5/5.42/site_perl install;
  ${YPKG}/git-install-mandocs.sh

final: |
  ${YBLD}/ydest-strip-x64.sh

recommended:
  - curl

optional:
  - apache
  - fcron
  - gnupg
  - openssh
  - subversion
  - tk
  - valgrind
  - io-socket-ssl
  - systemd-pam
  - linux-pam
  - xmlto
  - asciidoc
