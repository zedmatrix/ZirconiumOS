description: "Contains the rsync utility which is useful for synchronizing large file archives over a network."

package:
  name: rsync
  version: 3.4.4
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://www.samba.org/ftp/rsync/src/rsync-3.4.4.tar.gz
    sha256: bd88cf82fa653da32314fb229136407c5c90f80d1758d8f4b091767877d8fa96
    md5: 7357ebabdfc2802a280ee79b94c97cd2

prepare: |
  groupadd -g 48 rsyncd &&
  useradd -c "rsyncd Daemon" -m -d /home/rsync -g rsyncd -s /bin/false -u 48 rsyncd;
  ./configure --prefix=/usr --disable-xxhash --without-included-zlib

build: |
  make

check: |
  make check || true

install: |
  make DESTDIR=${DESTDIR} install

final: |
  ${YBLD}/ydest-strip-x64.sh
  ${YPKG}/rsyncd-conf.sh

recommended:
  - popt

optional:
  - doxygen
