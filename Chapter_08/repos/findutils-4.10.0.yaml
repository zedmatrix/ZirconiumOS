description: "Programs are provided to search through all the files in a directory tree and to create, maintain, and search a database."

package:
  name: findutils
  version: 4.10.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/findutils/findutils-4.10.0.tar.xz
    sha256: 1387e0b67ff247d2abde998f90dfbf70c1491391a59ddfecb8ae698789f0a4f5
    md5: 870cfd71c07d37ebe56f9f4aaf4ad872

prepare: |
  ./configure --prefix=/usr --localstatedir=/var/lib/locate

build: |
  make

check: |
  chown -R tester .;
  su tester -c "PATH=$PATH make check"

install: |
  make install

required:
  - bash
  - binutils
  - coreutils
  - gcc
  - gettext
  - glibc
  - grep
  - make-tmp
  - sed
  - texinfo-tmp
