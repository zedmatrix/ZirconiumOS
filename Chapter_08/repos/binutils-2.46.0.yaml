description: "The Binutils package contains a linker, an assembler, and other tools for handling object files."

package:
  name: binutils
  version: 2.46.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://sourceware.org/pub/binutils/releases/binutils-2.46.0.tar.xz
    sha256: d75a94f4d73e7a4086f7513e67e439e8fcdcbb726ffe63f4661744e6256b2cf2
    md5: 81bb6810bcd1119819dc0804956e1c92

prepare: |
  mkdir -v build && cd build &&
  ../configure --prefix=/usr --sysconfdir=/etc --enable-ld=default \
    --enable-plugins --enable-shared --disable-werror --enable-64-bit-bfd \
    --enable-new-dtags --with-system-zlib --enable-default-hash-style=gnu \
    --with-pkgversion="Zirconium ${PKGVER}"

build: |
  cd build && make tooldir=/usr

check: |
  cd build && make -k check;
  grep '^FAIL:' $(find -name '*.log') || true

install: |
  cd build && make tooldir=/usr install;
  rm -rfv /usr/lib/lib{bfd,ctf,ctf-nobfd,gprofng,opcodes,sframe}.a \
          /usr/share/doc/gprofng/

required:
  - zlib
  - zstd
  - bc
  - perl-tmp
  - glibc
