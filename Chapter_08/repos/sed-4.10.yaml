description: "The Sed package contains a stream editor."
package:
  name: sed
  version: 4.10
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/sed/sed-4.10.tar.xz
    sha256: b8e72182b2ec96a3574e2998c47b7aaa64cc20ce000d8e9ac313cc07cecf28c7
    md5: c70dc5372db95c816442ffedf77a0d0f

prepare: |
  ./configure --prefix=/usr

build: |
  make;
  make html

check: |
  chown -R tester .;
  su tester -c "PATH=$PATH make check"

install: |
  make install;
  install -d -m755 /usr/share/doc/sed-${PKGVER};
  install -m644 doc/sed.html /usr/share/doc/sed-${PKGVER}

required:
  - acl
  - gettext-tmp
  - glibc
