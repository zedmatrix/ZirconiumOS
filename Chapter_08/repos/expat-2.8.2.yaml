description: "The Expat package contains a stream oriented C library for parsing XML."

package:
  name: expat
  version: 2.8.2
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://github.com/libexpat/libexpat/releases/download/R_2_8_2/expat-2.8.2.tar.xz
    sha256: 3ad89b8588e6644bd4e49981480d48b21289eebbcd4f0a1a4afb1c29f99b6ab4
    md5: 849c7049b4ea160fdcc60b109ee654da

prepare: |
  ./configure --prefix=/usr --disable-static \
    --docdir=/usr/share/doc/expat-${PKGVER}

build: |
  make

check: |
  make check

install: |
  make install;
  install -v -m644 doc/*.{html,css} /usr/share/doc/expat-${PKGVER}

required:
  - glibc
