description: "The File package contains a utility for determining the type of a given file or files."

package:
  name: file
  version: 5.47
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://astron.com/pub/file/file-5.47.tar.gz
    sha256: 45672fec165cb4cc1358a2d76b5d57d22876dcb97ab169427ac385cbe1d5597a
    md5: 1023ef52a2fb64acdf80211e469d6939

prepare: |
  ./configure --prefix=/usr

build: |
  make

check: |
  make check

install: |
  make install

required:
  - bash-tmp
  - binutils-p2
  - bzip2
  - coreutils-tmp
  - diffutils-tmp
  - gawk-tmp
  - gcc-p2
  - glibc
  - grep-tmp
  - make-tmp
  - sed-tmp
  - xz
  - zlib
