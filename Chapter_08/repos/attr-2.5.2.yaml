description: "The Attr package contains utilities to administer the extended attributes of filesystem objects."

package:
  name: attr
  version: 2.5.2
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://download.savannah.gnu.org/releases/attr/attr-2.5.2.tar.gz
    sha256: 39bf67452fa41d0948c2197601053f48b3d78a029389734332a6309a680c6c87
    md5: 227043ec2f6ca03c0948df5517f9c927

prepare: |
  ./configure --prefix=/usr --disable-static  \
    --sysconfdir=/etc --docdir=/usr/share/doc/attr-${PKGVER}

build: |
  make

check: |
  make check

install: |
  make install

required:
  - gettext-tmp
  - glibc
