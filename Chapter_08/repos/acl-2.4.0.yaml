description: "The Acl package contains utilities to administer Access Control Lists for files and directories."

package:
  name: acl
  version: 2.4.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://download.savannah.gnu.org/releases/acl/acl-2.4.0.tar.xz
    sha256: e661131456d2708a01c614a0f400e11d7d1bfaeb6f3e74b75bb980b72f0161a3
    md5: e289f370161698a96f50b2a3fdadf411

prepare: |
  ./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/acl-${PKGVER}

build: |
  make

check: |
  make check || true

install: |
  make install

required:
  - attr
  - glibc
