description: "The Gettext package contains utilities for internationalization and localization."

package:
  name: gettext
  version: 1.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/gettext/gettext-1.0.tar.xz
    sha256: 71132a3fb71e68245b8f2ac4e9e97137d3e5c02f415636eb508ae607bc01add7
    md5: dc8b2911535929cec1e263706b0a13a1

prepare: |
  ./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/gettext-${PKGVER}

build: |
  make

check: |
  make check

install: |
  make install &&
  chmod -v 0755 /usr/lib/preloadable_libintl.so

required:
  - acl
  - attr
  - gcc
  - ncurses
  - bash-tmp
  - glibc
