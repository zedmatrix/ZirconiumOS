description: "The Xz package contains programs for compressing and decompressing files."

package:
  name: xz
  version: 5.8.3
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://github.com//tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.xz
    sha256: fff1ffcf2b0da84d308a14de513a1aa23d4e9aa3464d17e64b9714bfdd0bbfb6
    md5: a02753f34e5546d20213b87f876a0933

prepare: |
  ./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/xz-${PKGVER}

build: |
  make

check: |
  make check || true

install: |
  make install

required:
  - bash-tmp
  - binutils-p2
  - coreutils-tmp
  - diffutils-tmp
  - gcc-p2
  - glibc
  - make-tmp
