description: "The OpenSSH package contains ssh clients and the sshd daemon."

package:
  name: openssh
  version: 10.4p1
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.4p1.tar.gz
    sha256: ef6026dd2aea8d56059638d5d3262902c892ceba9f88395835e0d06d3fb63238
    md5: c5fb91ded926b38e8956074cac2cd44f

prepare: |
  install -v -g sys -m700 -d /var/lib/sshd &&
  groupadd -g 50 sshd &&
  useradd -c 'sshd PrivSep' -d /var/lib/sshd -g sshd -s /bin/false -u 50 sshd

build: |
  ./configure --prefix=/usr --sysconfdir=/etc/ssh --with-privsep-path=/var/lib/sshd \
    --with-default-path=/usr/bin --with-superuser-path=/usr/sbin:/usr/bin --with-pid-dir=/run &&
  make

install: |
  make install

final: |
  install -vm755 contrib/ssh-copy-id /usr/bin &&
  install -vm644 contrib/ssh-copy-id.1 /usr/share/man/man1 &&
  install -vdm755 /usr/share/doc/openssh-${PKGVER} &&
  install -vm644 INSTALL LICENCE OVERVIEW README* /usr/share/doc/openssh-${PKGVER}

required:
  - which

optional:
  - gdb
  - linux-pam
  - shadow-pam
  - mitkrb5
  - net-tools
  - sysstat
