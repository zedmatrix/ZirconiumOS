description: "The IPRoute2 package contains programs for basic and advanced IPV4-based networking."

package:
  name: iproute2
  version: 7.0.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://www.kernel.org/pub/linux/utils/net/iproute2/iproute2-7.0.0.tar.xz
    sha256: e62890f7b5de63c05a3bf331dc8deb4c015c336013f341a4edf46969797f2f4e
    md5: 20154826ff692100e09533879831b5c6

prepare: |
  sed -i /ARPD/d Makefile;
  rm -fv man/man8/arpd.8

build: |
  make NETNS_RUN_DIR=/run/netns

install: |
  make SBINDIR=/usr/sbin install;
  install -vDm644 COPYING README* -t /usr/share/doc/iproute2-${PKGVER}

required:
  - bash
  - bison
  - coreutils
  - flex
  - gcc
  - glibc
  - make-tmp
  - libcap
  - libelf
  - linux-headers
  - pkgconf
  - zlib
