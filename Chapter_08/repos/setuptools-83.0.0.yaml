description: "Setuptools is a tool used to download, build, install, upgrade, and uninstall Python packages."

package:
  name: setuptools
  version: 83.0.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://pypi.org/packages/source/s/setuptools/setuptools-83.0.0.tar.gz
    sha256: 025bccbbf0fa05b6192bc64ae1e7b16e001fd6d6d4d5de03c97b1c1ade523bef
    md5: f1d047722f6155a2150ed8546bfb75d8

build: |
  pip3 wheel -w dist --no-cache-dir --no-build-isolation --no-deps $PWD

install: |
  pip3 install --no-index --find-links dist setuptools

required:
  - python
  - flit-core
  - packaging
  - wheel
