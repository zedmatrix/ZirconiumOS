description: "The Glibc package contains the main C library."
note: "Wed Jul 22 11:43:08 PDT 2026"

package:
  name: glibc
  version: 2.43.9000-540-g0f731d92cd
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: sources/glibc-2.43.9000-540-g0f731d92cd.tar.gz
    sha256: f6fe1b131fc1c0ef4baac157ba13b76ba79ca0cd932be6e0f2779028c0b82d4c
    md5: 0fdac3befed7d8335c6e6f879fc62324
  - url: https://www.iana.org/time-zones/repository/releases/tzdata2026b.tar.gz
    sha256: 114543d9f19a6bfeb5bca43686aea173d38755a3db1f2eec112647ae92c6f544
    md5: 25425534443b0bdf501d6fb75442a041

patches:
  - url: https://www.linuxfromscratch.org/patches/lfs/development/glibc-fhs-1.patch
    sha256: 643552db030e2f2d7ffde4f558e0f5f83d3fabf34a2e0e56ebdb49750ac27b0d
    md5: 9a5997c3452909b1769918c759eff8a2

prepare: |
  mkdir -v build && cd build &&
  echo "rootsbindir=/usr/sbin" > configparms
  ../configure --prefix=/usr --disable-werror --disable-nscd \
    libc_cv_slibdir=/usr/lib --enable-stack-protector=strong --enable-kernel=5.10

build: |
  cd build && make

check: |
  cd build && make check;
  grep "Timed out" $(find -name \*.out) || true

install: |
  cd build && touch /etc/ld.so.conf;
  sed '/test-installation/s@$(PERL)@echo not running@' -i ../Makefile;
  make install;
  make localedata/install-locales;
  sed '/RTLDLIST=/s@/usr@@g' -i /usr/bin/ldd;
  install -vm644 ${YPKG}/glibc-nsswitch.conf /etc/nsswitch.conf;
  install -vm644 ${YPKG}/glibc-ldso.conf /etc/ld.so.conf;
  mkdir -pv /etc/ld.so.conf.d

final: |
  tar -xf ${YSRC}/tzdata2026b.tar.gz &&
  export ZONEINFO=/usr/share/zoneinfo;
  mkdir -pv $ZONEINFO/{posix,right};
  for tz in etcetera southamerica northamerica europe africa antarctica  \
            asia australasia backward; do
      zic -L /dev/null   -d $ZONEINFO       ${tz};
      zic -L /dev/null   -d $ZONEINFO/posix ${tz};
      zic -L leapseconds -d $ZONEINFO/right ${tz};
  done;
  cp -v zone.tab zone1970.tab iso3166.tab $ZONEINFO;
  zic -d $ZONEINFO -p America/New_York;
  ln -sfv /usr/share/zoneinfo/Canada/Pacific /etc/localtime

required:
  - bash-tmp
  - binutils-p2
  - bison-tmp
  - coreutils-tmp
  - diffutils-tmp
  - gawk-tmp
  - gcc-p2
  - gettext-tmp
  - grep-tmp
  - gzip-tmp
  - linux-headers
  - make-tmp
  - perl-tmp
  - python-tmp
  - sed-tmp
  - texinfo-tmp
