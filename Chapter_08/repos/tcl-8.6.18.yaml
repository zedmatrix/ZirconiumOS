description: "The Tcl package contains the Tool Command Language, a robust general-purpose scripting language."

package:
  name: tcl
  version: 8.6.18
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://downloads.sourceforge.net/tcl/tcl8.6.18-src.tar.gz
    sha256: 14f9af32b1767ff718477a8f974ad03c34341097e6b43f4ce54644ee974e268e
    md5: acfe0c9f7d0c626ecf026e834a888da6
  - url: https://downloads.sourceforge.net/tcl/tcl8.6.18-html.tar.gz
    sha256: bee2d83a19ce50624eeae951be29fe5f654b171357a6391123caf18107cec543
    md5: 54d1ff0f5eee4e81e5cdaa4baa343397

prepare: |
  SRCDIR=$(pwd) && cd unix &&
  ./configure --prefix=/usr --mandir=/usr/share/man --disable-rpath

build: |
  SRCDIR=$(pwd) && cd unix && make &&
  sed -e "s|$SRCDIR/unix|/usr/lib|" -e "s|$SRCDIR|/usr/include|" -i tclConfig.sh;
  sed -e "s|$SRCDIR/unix/pkgs/tdbc1.1.13|/usr/lib/tdbc1.1.13|" \
      -e "s|$SRCDIR/pkgs/tdbc1.1.13/generic|/usr/include|" \
    -e "s|$SRCDIR/pkgs/tdbc1.1.13/library|/usr/lib/tcl8.6|" \
    -e "s|$SRCDIR/pkgs/tdbc1.1.13|/usr/include|" -i pkgs/tdbc1.1.13/tdbcConfig.sh;
  sed -e "s|$SRCDIR/unix/pkgs/itcl4.3.7|/usr/lib/itcl4.3.7|" \
    -e "s|$SRCDIR/pkgs/itcl4.3.7/generic|/usr/include|" \
    -e "s|$SRCDIR/pkgs/itcl4.3.7|/usr/include|" -i pkgs/itcl4.3.7/itclConfig.sh;

check: |
  cd unix &&
  LC_ALL=C.UTF-8 make test

install: |
  cd unix && make install;
  make install-private-headers;
  chmod 644 /usr/lib/libtclstub8.6.a;
  chmod -v u+w /usr/lib/libtcl8.6.so;
  ln -sfv tclsh8.6 /usr/bin/tclsh;
  mv /usr/share/man/man3/{Thread,Tcl_Thread}.3

final: |
  tar -xf ${YSRC}/tcl8.6.18-html.tar.gz --strip-components=1 &&
  mkdir -v -p /usr/share/doc/tcl-8.6.18;
  cp -v -r ./html/* /usr/share/doc/tcl-8.6.18
