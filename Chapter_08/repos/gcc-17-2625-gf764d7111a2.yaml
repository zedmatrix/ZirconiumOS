description: "The GCC package contains the GNU compiler collection which includes the C and C++ compilers."

package:
  name: gcc
  version: 17-2625-gf764d7111a2
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: sources/gcc-17-2625-gf764d7111a2.tar.gz
    sha256: 70c1fae4281d83c32c943295eadeab3a325f6585319ae95d949d3beeb09353b1
    md5: 9a2bba77a19f9f2c8eff569c760cf47a

prepare: |
  sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64;
  mkdir -v build && cd build &&
  ../configure --prefix=/usr LD=ld --enable-languages=c,c++ \
    --enable-default-pie --enable-default-ssp --enable-host-pie \
    --disable-multilib --disable-bootstrap --disable-fixincludes \
    --with-system-zlib

build: |
  cd build && make

check: |
  cd build &&
  ulimit -s -H unlimited;
  sed -e '/cpython/d' -i ../gcc/testsuite/gcc.dg/plugin/plugin.exp;
  chown -R antares .;
  su antares -c "PATH=$PATH make -k check";
  ../contrib/test_summary;
  chown -v -R root:root $(gcc -print-file-name=include){,-fixed}

install: |
  cd build && make install;
  ${YPKG}/gcc-testsuite.sh || true

final: |
  cd build &&
  ln -svr /usr/bin/cpp /usr/lib;
  ln -sv gcc.1 /usr/share/man/man1/cc.1;
  ln -sfvr $(gcc -print-prog-name=liblto_plugin.so) /usr/lib/bfd-plugins/;
  mkdir -pv /usr/share/gdb/auto-load/usr/lib;
  mv -v /usr/lib/*gdb.py /usr/share/gdb/auto-load/usr/lib

required:
  - binutils
  - gmp
  - mpfr
  - mpc
  - acl
  - attr
  - zlib
  - zstd
  - glibc

strip-note: |
  libstdc++.so.6.0.37
  libquadmath.so.0.0.0
  libatomic.so.1.2.0
  libitm.so.1.0.0
  libthread_db.so.1
  libc.so.6
  libm.so.6

