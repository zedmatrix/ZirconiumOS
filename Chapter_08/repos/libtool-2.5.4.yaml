description: "Package contains the GNU generic library support script, to make use of shared libraries simpler with a consistent, portable interface."

package:
  name: libtool
  version: 2.5.4
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/libtool/libtool-2.5.4.tar.xz
    sha256: f81f5860666b0bc7d84baddefa60d1cb9fa6fceb2398cc3baca6afaa60266675
    md5: 22e0a29df8af5fdde276ea3a7d351d30

prepare: |
  ./configure --prefix=/usr

build: |
  make

check: |
  make check

install: |
  make install;
  rm -fv /usr/lib/libltdl.a

required:
  - tar-tmp
  - bash
  - gcc
  - glibc
