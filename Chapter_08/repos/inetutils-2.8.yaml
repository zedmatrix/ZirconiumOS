description: "The Inetutils package contains programs for basic networking."

package:
  name: inetutils
  version: 2.8
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/inetutils/inetutils-2.8.tar.gz
    sha256: 57b3cf4f77555992881e5ba2a09a63b05aa2c56342a60ed4305b5f45938390b5
    md5: f0f9ad13045a67da9c882148f9efae6b

prepare: |
  sed -i 's/def HAVE_TERMCAP_TGETENT/ 1/' telnet/telnet.c;
  ./configure --prefix=/usr --bindir=/usr/bin --localstatedir=/var --disable-logger \
    --disable-whois --disable-rcp --disable-rexec --disable-rlogin --disable-rsh --disable-servers

build: |
  make

check: |
  make check || true

install: |
  make install;
  mv -v /usr/{,s}bin/ifconfig

required:
  - python-tmp
  - libxcrypt
  - libcap
  - ncurses
  - readline
  - glibc
