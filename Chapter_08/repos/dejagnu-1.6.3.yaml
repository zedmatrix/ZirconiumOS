description: "The DejaGnu package contains a framework for running test suites on GNU tools."

package:
  name: dejagnu
  version: 1.6.3
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/dejagnu/dejagnu-1.6.3.tar.gz
    sha256: 87daefacd7958b4a69f88c6856dbd1634261963c414079d0c371f589cd66a2e3
    md5: 68c5208c58236eba447d7d6d1326b821

prepare: |
  mkdir -v build && cd build &&
  ../configure --prefix=/usr

build: |
  cd build &&
  makeinfo --html --no-split -o doc/dejagnu.html ../doc/dejagnu.texi;
  makeinfo --plaintext       -o doc/dejagnu.txt  ../doc/dejagnu.texi

check: |
  cd build && make check || true

install: |
  cd build && make install &&
  install -v -dm755  /usr/share/doc/dejagnu-${PKGVER};
  install -v -m644   doc/dejagnu.{html,txt} /usr/share/doc/dejagnu-${PKGVER}

required:
  - expect
  - tcl
  - bash-tmp
  - glibc
