description: "The Flex package contains a utility for generating programs that recognize patterns in text."

package:
  name: flex
  version: 2.6.4
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://github.com/westes/flex/releases/download/v2.6.4/flex-2.6.4.tar.gz
    sha256: e87aae032bf07c26f85ac0ed3250998c37621d95f8bd748b31f15b33c45ee995
    md5: 2882e3179748cc9f9c23ec593d6adc8d

prepare: |
  ./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/flex-${PKGVER}

build: |
  make

check: |
  make check

install: |
  make install;
  ln -sv flex   /usr/bin/lex;
  ln -sv flex.1 /usr/share/man/man1/lex.1

required:
  - glibc
  - m4
  - bash-tmp
