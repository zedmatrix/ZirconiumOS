description: "The GCC package contains the GNU compiler collection, which includes the C and C++ compilers."

package:
  name: gcc-p2
  version: 16.1.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz
    sha256: 50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79
    md5: 9b016416f8e2dce4a0ef8759d1936446
  - url: https://mirror.csclub.uwaterloo.ca/gnu/mpfr/mpfr-4.2.2.tar.xz
    sha256: b67ba0383ef7e8a8563734e2e889ef5ec3c3b898a01d00fa0a6869ad81c6ce01
    md5: 7c32c39b8b6e3ae85f25156228156061
  - url: https://mirror.csclub.uwaterloo.ca/gnu/mpc/mpc-1.4.1.tar.xz
    sha256: 91204cd32f164bd3b7c992d4a6a8ce6519511aadab30f78b6982d0bf8d73e931
    md5:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/gmp/gmp-6.3.0.tar.xz
    sha256: a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898
    md5: 956dc04e864001a9c22429f761f2c283

prepare: |
  tar -xf ${YSRC}/mpfr-4.2.2.tar.xz && mv -v mpfr-4.2.2 mpfr &&
  tar -xf ${YSRC}/gmp-6.3.0.tar.xz && mv -v gmp-6.3.0 gmp &&
  tar -xf ${YSRC}/mpc-1.4.1.tar.xz && mv -v mpc-1.4.1 mpc &&
  sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64;
  sed '/thread_header =/s/@.*@/gthr-posix.h/' -i libgcc/Makefile.in libstdc++-v3/include/Makefile.in;

build: |
  mkdir -v build && cd build;
  ../configure --prefix=/usr --host=$YTARGET --target=$YTARGET --build=$(../config.guess) \
    --with-build-sysroot=$YLFS --enable-default-pie --enable-default-ssp --disable-nls \
    --disable-multilib --disable-libatomic --disable-libgomp --disable-libquadmath \
    --disable-libsanitizer --disable-libssp --disable-libvtv --enable-languages=c,c++ \
    --with-pkgversion="Zirconium ${PKGVER}" LDFLAGS_FOR_TARGET=-L$PWD/$YTARGET/libgcc &&
  make

install: |
  cd build && make DESTDIR=$YLFS install;
  ln -sv gcc $YLFS/usr/bin/cc

required:
  - xz-tmp
  - gcc-p1
  - binutils-p2
  - glibc-tmp
  - linux-headers
