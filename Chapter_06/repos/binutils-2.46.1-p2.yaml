description: "The Binutils package contains a linker, an assembler, and other tools for handling object files."

package:
  name: binutils-p2
  version: 2.46.1
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://sourceware.org/pub/binutils/releases/binutils-2.46.1.tar.xz
    sha256: e127a709cba24c76de8936cb7083dd768f28cd37eb010492e2f19b71eb1294e4
    md5: 9b9b73791519bf6fc8d76c7fc9fd32fe

prepare: |
  sed '6031s/$add_dir//' -i ltmain.sh;
  mkdir -v build && cd build;
  ../configure --prefix=/usr --host=$YTARGET --build=$(../config.guess) --disable-werror \
    --disable-nls --enable-shared --enable-gprofng=no --enable-64-bit-bfd --enable-new-dtags \
    --with-pkgversion="Zirconium ${PKGVER}" --enable-default-hash-style=gnu

build: |
  cd build && make

install: |
  cd build && make DESTDIR=$YLFS install;
  rm -v $LFS/usr/lib/lib{bfd,ctf,ctf-nobfd,opcodes,sframe}.{a,la}

required:
  - xz-tmp
  - gcc-p1
  - binutils-p1
  - glibc-tmp
  - linux-headers
