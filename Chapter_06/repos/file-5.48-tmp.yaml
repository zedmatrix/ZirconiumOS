description: "File package contains a utility for determining the type of a given file or files."

package:
  name: file-tmp
  version: 5.48
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://astron.com/pub/file/file-5.48.tar.gz
    sha256: ed14656883b23a364b4057c05595d93252da9bc473d30106519519d0da141283
    md5: 423686e97f731d8c24e9cd1a22b03dec

prepare: |
  mkdir build && pushd build
    ../configure --disable-bzlib --disable-libseccomp --disable-xzlib --disable-zlib &&
    make
  popd

build: |
  ./configure --prefix=/usr --host=$YTARGET --build=$(./config.guess) &&
  make FILE_COMPILE=$(pwd)/build/src/file

install: |
  make DESTDIR=$YLFS install
  rm -v $YLFS/usr/lib/libmagic.la

required:
  - diffutils-tmp
