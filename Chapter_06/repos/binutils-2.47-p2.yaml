description: "The Binutils package contains a linker, an assembler, and other tools for handling object files."

package:
  name: binutils-p2
  version: 2.47
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://sourceware.org/pub/binutils/releases/binutils-2.47.tar.xz
    sha256: 154ab23b60070e8f27013c22977f1129425d67d1e8acd6e13010e617811e4cff
    md5: d772acfbd55a81644e9fe7b8189cd2a5

prepare: |
  sed '6031s/$add_dir//' -i ltmain.sh;
  mkdir -v build && cd build;
  ../configure --prefix=/usr --host=$YTARGET --build=$(../config.guess) --disable-werror \
    --disable-nls --enable-shared --enable-gprofng=no --enable-64-bit-bfd --enable-new-dtags \
    --with-pkgversion="Zirconium ${PKGVER}" --enable-default-hash-style=gnu

build: |
  cd build && make

install: |
  cd build && make DESTDIR=$YLFS install;
  rm -v $YLFS/usr/lib/lib{bfd,ctf,ctf-nobfd,opcodes,sframe}.{a,la}

required:
  - xz-tmp
  - gcc-p1
  - binutils-p1
  - glibc-tmp
  - linux-headers
