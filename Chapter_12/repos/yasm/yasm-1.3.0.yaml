package:
    name: yasm-1.3.0
    version:
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.tortall.net/projects/yasm/releases/yasm-1.3.0.tar.gz
      md5: fc9e586751ff789b34b1f21d572d96af

prepare: |
    sed -e 's/def __cplusplus/ defined(__cplusplus) || __STDC_VERSION__ >= 202311L/' \
    -i libyasm/bitvect.h &&
    sed -i 's#) ytasm.*#)#' Makefile.in

build: |
    ./configure --prefix=/usr &&
    make

check: |
    make -j1 check

install: |
    make install

optional:
    - cython
    - python
