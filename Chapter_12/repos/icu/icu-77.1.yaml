package:
    name: icu
    version: 77.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/unicode-org/icu/releases/download/release-77-1/icu4c-77_1-src.tgz
      md5: bc0132b4c43db8455d2446c3bae58898

build: |
    cd source &&
    ./configure --prefix=/usr &&
    make

check: |
    cd source && make check

install: |
    cd source && make install

optional:
    - doxygen
