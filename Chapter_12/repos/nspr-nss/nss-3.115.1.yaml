package:
    name: nss
    version: 3.115.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://archive.mozilla.org/pub/security/nss/releases/NSS_3_115_1_RTM/src/nss-3.115.1.tar.gz
      md5: c9d46d028baa10dbcbac81db1fd95e58

patches:
    - url: https://www.linuxfromscratch.org/patches/blfs/svn/nss-standalone-1.patch
      md5: f8a7ce473bd61792ef182cf0fb2d359a

build: |
    cd nss &&
    make BUILD_OPT=1 NSPR_INCLUDE_DIR=/usr/include/nspr USE_SYSTEM_ZLIB=1 \
        ZLIB_LIBS=-lz NSS_ENABLE_WERROR=0 \
    $([ $(uname -m) = x86_64 ] && echo USE_64=1) \
    $([ -f /usr/include/sqlite3.h ] && echo NSS_USE_SYSTEM_SQLITE=1)

check: |
    cd nss/tests &&
    HOST=localhost DOMSUF=localdomain ./all.sh

install: |
    cd dist
    install -v -m755 Linux*/lib/*.so /usr/lib &&
    install -v -m644 Linux*/lib/{*.chk,libcrmf.a} /usr/lib &&
    install -v -m755 -d /usr/include/nss &&
    cp -v -RL {public,private}/nss/* /usr/include/nss &&
    install -v -m755 Linux*/bin/{certutil,nss-config,pk12util} /usr/bin &&
    install -v -m644 Linux*/lib/pkgconfig/nss.pc  /usr/lib/pkgconfig

final: |
    ln -sfv ./pkcs11/p11-kit-trust.so /usr/lib/libnssckbi.so

required:
    - nspr

recommended:
    - p11-kit
