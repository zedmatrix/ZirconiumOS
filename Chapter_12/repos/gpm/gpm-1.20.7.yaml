package:
    name: gpm
    version: 1.20.7
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://anduin.linuxfromscratch.org/BLFS/gpm/gpm-1.20.7.tar.bz2
      md5: bf84143905a6a903dbd4d4b911a2a2b8

patches:
    - url: https://www.linuxfromscratch.org/patches/blfs/svn/gpm-1.20.7-consolidated-1.patch
      md5: 7f7d72b794c44c60afc122aca70838e0
    - url: https://www.linuxfromscratch.org/patches/blfs/svn/gpm-1.20.7-gcc15_fixes-1.patch
      md5: d9978705320563da2a8353cfbe6825c3

prepare: |
    ./autogen.sh && ./configure --prefix=/usr --sysconfdir=/etc ac_cv_path_emacs=no

build: |
    make

install: |
    make install &&
    install -vm644 ${YSRC}/gpm.path /usr/lib/systemd/system/ &&
    install -vm644 ${YSRC}/gpm.service /usr/lib/systemd/system/ &&
    systemctl enable gpm.service

final: |
    install-info --dir-file=/usr/share/info/dir /usr/share/info/gpm.info &&
    install -v -m644 conf/gpm-root.conf /etc &&
    install -v -m755 -d /usr/share/doc/gpm-1.20.7/support &&
    install -v -m644 doc/support/* /usr/share/doc/gpm-1.20.7/support &&
    install -v -m644 doc/{FAQ,HACK_GPM,README*} /usr/share/doc/gpm-1.20.7 &&
    ln -sfv libgpm.so.2.1.0 /usr/lib/libgpm.so
