package:
    name: libssh2
    version: 1.11.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.libssh2.org/download/libssh2-1.11.1.tar.gz
      md5: 38857d10b5c5deb198d6989dacace2e6

build: |
    ./configure --prefix=/usr --disable-docker-tests --disable-static && make

check: |
    make check

install: |
    make install

optional:
    - cmake
    - libgcrypt
    - openssh
