package:
    name: shadow-pam
    version: 4.18.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/shadow-maint/shadow/releases/download/4.18.0/shadow-4.18.0.tar.xz
      md5: 30ef46f54363db1d624587be68794ef2

prepare: |
    sed -i 's/groups$(EXEEXT) //' src/Makefile.in &&
    find man -name Makefile.in -exec sed -i 's/groups\.1 / /'   {} \; &&
    find man -name Makefile.in -exec sed -i 's/getspnam\.3 / /' {} \; &&
    find man -name Makefile.in -exec sed -i 's/passwd\.5 / /'   {} \; &&
    sed -e 's@#ENCRYPT_METHOD DES@ENCRYPT_METHOD YESCRYPT@' \
    -e 's@/var/spool/mail@/var/mail@' -e '/PATH=/{s@/sbin:@@;s@/bin:@@}' -i etc/login.defs

build: |
    ./configure --sysconfdir=/etc --disable-static \
        --without-libbsd --with-{b,yes}crypt &&
    make

install: |
    make exec_prefix=/usr pamddir= install

final: |
    ${YSRC}/config-login-def.sh &&
    pam_files=(login passwd su chpasswd newusers chage chfn chgpasswd chsh)

    for f in "${pam_files[@]}"; do
        install -vm644 "${YSRC}/${f}" "/etc/pam.d/${f}"
    done

    misc_files=(groupadd groupdel groupmems groupmod useradd userdel usermod)

    for f in "${misc_files[@]}"; do
        install -vm644 "${YSRC}/${f}" "/etc/${f}"
    done

required:
    - linux-pam

optional:
    - libbsd
    - tcb
