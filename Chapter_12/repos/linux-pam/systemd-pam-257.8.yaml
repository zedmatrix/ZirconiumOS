package:
    name: systemd-pam
    version: 257.8
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/systemd/systemd/archive/v257.8/systemd-257.8.tar.gz
      md5: 25fe5d328e22641254761f1baa74cee0

prepare: |
    sed -i -e 's/GROUP="render"/GROUP="video"/' -e 's/GROUP="sgx", //' rules.d/50-udev-default.rules.in &&
    meson setup ybuild --prefix=/usr --buildtype=release -D default-dnssec=no -D firstboot=false \
      -D install-tests=false -D ldconfig=false -D man=auto -D sysusers=false -D rpmmacrosdir=no \
      -D homed=disabled -D userdb=false -D mode=release -D pam=enabled -D pamconfdir=/etc/pam.d \
      -D dev-kvm-mode=0660 -D nobody-group=nogroup -D sysupdate=disabled -D ukify=disabled \
      -D docdir=/usr/share/doc/systemd-257.8

build: |
    ninja -C ybuild

check: |
    ninja -C ybuild test

install: |
    ninja -C ybuild install

final: |
    install -vm644 ${YSRC}/sysd-system-session /etc/pam.d/system-session &&
    install -vm644 ${YSRC}/systemd-user /etc/pam.d/systemd-user &&
    systemctl daemon-reexec

required:
    - linux-pam

recommended:

optional:
    - polkit
    - btrfs-progs
    - curl
    - cryptsetup
    - git
    - gnutls
    - iptables
    - libarchive
    - libgcrypt
    - libidn2
    - libpwquality
    - libseccomp
    - libxkbcommon
    - make-ca
    - p11-kit
    - qemu
    - libqrencode
    - rsync
    - docbook-xml
    - docbook-xsl-nons
    - libxslt
    - lxml
