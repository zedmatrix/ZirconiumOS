package:
    name: brotli
    version: 1.1.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/google/brotli/archive/v1.1.0/brotli-1.1.0.tar.gz
      md5: 3a6a3dba82a3604792d3cb0bd41bca60

prepare: |
    cmake -B Ybuild -D CMAKE_INSTALL_PREFIX=/usr -D CMAKE_BUILD_TYPE=Release

build: |
    cmake --build Ybuild

install: |
    cmake --install Ybuild

final: |
    ${YSRC}/python-brotli.sh

required:
    - cmake

optional:
    - pytest
