package:
    name: lzo
    version: 2.10
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.oberhumer.com/opensource/lzo/download/lzo-2.10.tar.gz
      md5: 39d3f3f9c55c87b1e5d6888e1420f4b5

build: |
    ./configure --prefix=/usr --enable-shared --disable-static \
        --docdir=/usr/share/doc/lzo-2.10 &&
    make

check: |
    make check

install: |
    make install
