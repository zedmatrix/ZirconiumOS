package:
    name: nasm
    version: 2.16.03
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03.tar.xz
      md5: 2b8c72c52eee4f20085065e68ac83b55
    - url: https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/nasm-2.16.03-xdoc.tar.xz
      md5:

build: |
    ./configure --prefix=/usr &&
    make

install: |
    make install

final: |
    tar -xf ${YSRC}/nasm-2.16.03-xdoc.tar.xz --strip-components=1 &&
    install -m755 -d /usr/share/doc/nasm-2.16.03/html &&
    cp -v doc/html/*.html /usr/share/doc/nasm-2.16.03/html &&
    cp -v doc/*.{txt,ps,pdf} /usr/share/doc/nasm-2.16.03

optional:
    - asciidoc
    - xmlto
