package:
    name: libxslt
    version: 1.1.43
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://download.gnome.org/sources/libxslt/1.1/libxslt-1.1.43.tar.xz
      md5: 5dc0179c81be7a3082b43030ecfdebd4

build: |
    ./configure --prefix=/usr --disable-static \
        --docdir=/usr/share/doc/libxslt-1.1.43 &&
    make

check: |
    make check

install: |
    make install

required:
    - libxml2

recommended:
    - docbook-xml
    - docbook-xsl-nons

optional:
    - libgcrypt
