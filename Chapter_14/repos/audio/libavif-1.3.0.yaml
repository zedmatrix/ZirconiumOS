package:
    name: libavif-1.3.0
    version:
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/AOMediaCodec/libavif/archive/v1.3.0/libavif-1.3.0.tar.gz
      md5: e180551c0989f7e096a4440b89d6282d

prepare: |
    cmake -B Ybuild -D CMAKE_INSTALL_PREFIX=/usr -D CMAKE_BUILD_TYPE=Release -D AVIF_CODEC_AOM=SYSTEM \
      -D AVIF_BUILD_GDK_PIXBUF=ON -D AVIF_LIBYUV=OFF -G Ninja

build: |
    ninja -C Ybuild

install: |
    ninja -C Ybuild install

final: |
    gdk-pixbuf-query-loaders --update-cache

required:
    - libaom

recommended:
    - gdk-pixbuf

optional:
    - libdav1d
    - rav1e
    - svt-av1
