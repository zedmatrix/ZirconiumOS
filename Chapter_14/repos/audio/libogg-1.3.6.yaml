package:
    name: libogg
    version: 1.3.6
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://downloads.xiph.org/releases/ogg/libogg-1.3.6.tar.xz
      md5: 529275432dff072f63d4ed0f1f961384

build: |
    ./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/libogg-1.3.6 &&
    make

check: |
    make check

install: |
    make install
