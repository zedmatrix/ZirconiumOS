package:
    name: libvorbis
    version: 1.3.7
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.xz
      md5: 50902641d358135f06a8392e61c9ac77

build: |
    ./configure --prefix=/usr --disable-static &&
    make

check: |
    make -j1 check

install: |
    make install &&
    install -v -m644 doc/Vorbis* /usr/share/doc/libvorbis-1.3.7

required:
    - libogg

optional:
    - doxygen
    - texlive
    - tl-installer
