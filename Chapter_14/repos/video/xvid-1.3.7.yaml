package:
    name: xvid
    version: 1.3.7
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://downloads.xvid.com/downloads/xvidcore-1.3.7.tar.gz
      md5: 5c6c19324608ac491485dbb27d4da517

prepare: |
    sed -i '/typedef int bool;/d' src/encoder.h;
    cd build/generic &&
    sed -i 's/^LN_S=@LN_S@/& -f -v/' platform.inc.in;
    ./configure --prefix=/usr

build: |
    cd build/generic && make

install: |
    cd build/generic &&
    sed -i '/libdir.*STATIC_LIB/ s/^/#/' Makefile &&
    make install &&
    chmod -v 755 /usr/lib/libxvidcore.so.4.3

final: |
    install -v -m755 -d /usr/share/doc/xvidcore-1.3.7/examples;
    install -v -m644 doc/* /usr/share/doc/xvidcore-1.3.7;
    install -v -m644 examples/* /usr/share/doc/xvidcore-1.3.7/examples

optional:
    - yasm
    - nasm
