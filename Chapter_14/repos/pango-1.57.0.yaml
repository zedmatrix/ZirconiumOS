package:
    name: pango
    version: 1.57.0
    rel: 1
    archive: false
    delete: true

sources: 
    - url: https://download.gnome.org/sources/pango/1.57/pango-1.57.0.tar.xz
      md5: c027445c1325603a2a11df2fd868e6b8

prepare: |
    meson setup ybuild --prefix=/usr --buildtype=release --wrap-mode=nofallback -D introspection=enabled

build: |
    ninja -C ybuild

check: |
    ninja -C ybuild test

install: |
    ninja -C ybuild install

required:
    - fontconfig-pass2
    - freetype2
    - harfbuzz
    - fribidi
    - glib2

recommended:
    - cairo
    - libX11
    - libXft
    - libXrender

optional:
    - gi-docgen
