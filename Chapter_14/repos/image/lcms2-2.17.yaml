package:
    name: lcms2
    version: 2.17
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/mm2/Little-CMS/releases/download/lcms2.17/lcms2-2.17.tar.gz
      md5: 9f44275ee8ac122817e94fdc50ecce13

build: |
    ./configure --prefix=/usr --disable-static && make

check: |
    make check

install: |
    make install

optional:
    - libjpeg-turbo
    - libtiff
