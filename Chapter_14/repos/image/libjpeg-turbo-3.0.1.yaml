package:
    name: libjpeg-turbo
    version: 3.0.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://downloads.sourceforge.net/libjpeg-turbo/libjpeg-turbo-3.0.1.tar.gz
      md5: 1fdc6494521a8724f5f7cf39b0f6aff3

prepare: |
    cmake -B Ybuild -D CMAKE_INSTALL_PREFIX=/usr -D CMAKE_BUILD_TYPE=RELEASE -D ENABLE_STATIC=FALSE \
        -D CMAKE_INSTALL_DEFAULT_LIBDIR=lib -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -D CMAKE_SKIP_INSTALL_RPATH=ON \
        -D CMAKE_INSTALL_DOCDIR=/usr/share/doc/libjpeg-turbo-3.0.1

build: |
    cmake --build Ybuild

check: |
    cd Ybuild && make test

install: |
    cmake --install Ybuild

required:
    - cmake

recommended:
    - nasm

optional:
    - yasm
