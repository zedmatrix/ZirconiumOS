package:
    name: libwebp
    version: 1.6.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0.tar.gz
      md5: cceb6447180f961473b181c9ef38b630

prepare: |
    ./configure --prefix=/usr --enable-libwebpmux --enable-libwebpdemux --enable-libwebpdecoder \
        --enable-libwebpextras --enable-swap-16bit-csp --disable-static

build: |
    make

install: |
    make install

recommended:
    - libjpeg-turbo
    - libpng
    - libtiff
    - sdl2

optional:
    - freeglut
    - giflib
