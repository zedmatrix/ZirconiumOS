package:
    name: imlib2
    version: 1.12.5
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://downloads.sourceforge.net/enlightenment/imlib2-1.12.5.tar.xz
      md5: c81c9f91d92ecbd87cf652f867ec5d74

build: |
    ./configure --prefix=/usr --disable-static &&
    make

install: |
    make install

required:
    - libXext

recommended:
    - freetype2
    - giflib
    - libjpeg-turbo
    - libpng
    - libtiff
    - xz

optional:
    - highway
    - libjxl
    - libwebp
    - doxygen
