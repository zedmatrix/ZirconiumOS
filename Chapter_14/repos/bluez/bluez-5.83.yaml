package:
    name: bluez
    version: 5.83
    rel: 1
    archive: false
    delete: true

sources: 
    - url: https://www.kernel.org/pub/linux/bluetooth/bluez-5.83.tar.xz
      md5: 59cf5b86dd008180503a159109bbfb9a

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \
        --disable-manpages --enable-library &&
    make

check: |
    make check

install: |
    make install &&
    ln -svf ../libexec/bluetooth/bluetoothd /usr/sbin;
    install -v -dm755 /etc/bluetooth;
    install -v -m644 src/main.conf /etc/bluetooth/main.conf;
    install -v -dm755 /usr/share/doc/bluez-5.83;
    install -v -m644 doc/*.txt /usr/share/doc/bluez-5.83;
    install -m644 ./obexd/src/org.bluez.obex.service /usr/share/dbus-1/services;

final: |
    install -m644 ${YSRC}/rfcomm.conf /etc/bluetooth/rfcomm.conf;
    install -m644 ${YSRC}/uart.conf /etc/bluetooth/uart.conf;
    systemctl enable bluetooth
    systemctl enable --global obex

required:
    - dbus
    - glib2
    - libical

optional:
    - docutils
