package:
    name: gst-plugins-good
    version: 1.26.6
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.26.6.tar.xz
      md5: 2fc952136516bb94421599c11ad44e66

prepare: |
    meson setup ybuild --prefix=/usr --buildtype=release

build: |
    ninja -C ybuild

install: |
    ninja -C ybuild install

required:
    - gst-plugins-base

recommended:
    - cairo
    - flac
    - gdk-pixbuf
    - lame
    - libsoup
    - libvpx
    - mpg123
    - nasm
    - pulseaudio

optional:
    - aalib
    - gtk3
    - libdv
    - qt6
    - speex
    - taglib
    - valgrind
    - v4l-utils
    - wayland
