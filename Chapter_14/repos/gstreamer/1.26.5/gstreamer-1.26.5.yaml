package:
    name: gstreamer
    version: 1.26.5
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://gstreamer.freedesktop.org/src/gstreamer/gstreamer-1.26.5.tar.xz
      md5: 2585de32253e8b159cbddf92b21b0261

prepare: |
    meson setup ybuild --prefix=/usr --buildtype=release -D gst_debug=false

build: |
    ninja -C ybuild

check: |
    ninja -C ybuild test

install: |
    ninja -C ybuild install

required:
    - gobject-introspection
    - glib2

optional:
    - gtk3
    - gsl
    - libnsl
    - libunwind
    - rustc
    - valgrind
