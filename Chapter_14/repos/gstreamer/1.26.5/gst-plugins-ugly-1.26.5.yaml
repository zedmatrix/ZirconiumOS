package:
    name: gst-plugins-ugly
    version: 1.26.5
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://gstreamer.freedesktop.org/src/gst-plugins-ugly/gst-plugins-ugly-1.26.5.tar.xz
      md5: 5316ced5357c6af10ab1651084f2f09d

prepare: |
    meson setup ybuild --prefix=/usr --buildtype=release -D gpl=enabled

build: |
    ninja -C ybuild

check: |
    ninja -C ybuild test

install: |
    ninja -C ybuild install

required:
    - gst-plugins-base

recommended:
    - liba52
    - libdvdread
    - x264

optional:
    - libmpeg2
    - libcdio
    - valgrind
