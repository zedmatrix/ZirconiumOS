package:
    name: libcddb
    version: 1.3.2
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://downloads.sourceforge.net/libcddb/libcddb-1.3.2.tar.bz2
      md5: 8bb4a6f542197e8e9648ae597cd6bc8a

prepare: |
    sed -e '/DEFAULT_SERVER/s/freedb.org/gnudb.gnudb.org/' -e '/DEFAULT_PORT/s/888/&0/' -i include/cddb/cddb_ni.h &&
    sed '/^Genre:/s/Trip-Hop/Electronic/' -i tests/testdata/920ef00b.txt &&
    sed '/DISCID/i# Revision: 42' -i tests/testcache/misc/12340000 &&
    sed -i 's/size_t l;/socklen_t l;/' lib/cddb_net.c

build: |
    ./configure --prefix=/usr --disable-static && make

check: |
    make check -k

install: |
    make install
