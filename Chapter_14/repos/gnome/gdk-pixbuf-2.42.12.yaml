package:
    name: gdk-pixbuf
    version: 2.42.12
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://download.gnome.org/sources/gdk-pixbuf/2.42/gdk-pixbuf-2.42.12.tar.xz
      md5: f986fdbba5ec6233c96f8b6535811780

prepare: |
    meson setup ybuild --prefix=/usr --buildtype=release --wrap-mode=nofallback -D others=enabled

build: |
    ninja -C ybuild

check: |
    ninja -C ybuild test

install: |
    ninja -C ybuild install

required:
    - glib2
    - gobject-introspection
    - libjpeg-turbo
    - libpng
    - shared-mime-info

recommended:
    - docutils
    - libtiff

optional:
    - librsvg
    - gi-docgen
    - libavif
    - libjxl
    - webp-pixbuf-loader
