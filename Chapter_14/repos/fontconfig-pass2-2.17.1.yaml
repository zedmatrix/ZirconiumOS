package:
    name: fontconfig-pass2
    version: 2.17.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/2.17.1/fontconfig-2.17.1.tar.xz
      md5: f68f95052c7297b98eccb7709d817f6a

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \
        --disable-docs --docdir=/usr/share/doc/fontconfig-2.17.1 &&
    make

check: |
    make check

install: |
    make install

required:
    - freetype2
    - harfbuzz

optional:
    - bubblewrap
    - curl
    - libarchive
    - json-c
    - docbook-utils
    - libxml2
    - texlive
