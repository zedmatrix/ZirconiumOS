package:
    name: vala
    version: 0.56.18
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://download.gnome.org/sources/vala/0.56/vala-0.56.18.tar.xz
      md5: 14238ac89810b932db9fd75999739494

build: |
    ./configure --prefix=/usr && make

check: |
    make check

install: |
    make install

required:
    - glib2

recommended:
    - graphviz

optional:
    - dbus
    - libxslt
