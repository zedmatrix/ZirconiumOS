package:
    name: dbus-pass2
    version: 1.16.2
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://dbus.freedesktop.org/releases/dbus/dbus-1.16.2.tar.xz
      md5: 97832e6f0a260936d28536e5349c22e5

prepare: |
    meson setup ybuild --prefix=/usr --buildtype=release --wrap-mode=nofallback

build: |
    ninja -C ybuild

install: |
    ninja -C ybuild install

final: |
    if [ -e /usr/share/doc/dbus ]; then
        rm -rf /usr/share/doc/dbus-1.16.2    &&
        mv -v  /usr/share/doc/dbus{,-1.16.2}
    fi

required:
    - libX11
    - systemd-pam

optional:
    - valgrind
    - doxygen
    - xmlto
    - dbus-python
    - pygobject
