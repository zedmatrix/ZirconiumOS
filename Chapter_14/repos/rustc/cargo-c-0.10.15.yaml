package:
    name: cargo-c
    version: 0.10.15
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/lu-zero/cargo-c/archive/v0.10.15/cargo-c-0.10.15.tar.gz
      md5: 082c8d0028ccb1c4c2dacb1d9a44ed6e

prepare: |
    curl -fLO https://github.com/lu-zero/cargo-c/releases/download/v0.10.15/Cargo.lock

build: |
    [ ! -e /usr/include/libssh2.h ] || export LIBSSH2_SYS_USE_PKG_CONFIG=1 &&
    [ ! -e /usr/include/sqlite3.h ] || export LIBSQLITE3_SYS_USE_PKG_CONFIG=1 &&
    cargo build --release

check: |
    cargo test --release

install: |
    install -vm755 target/release/cargo-{capi,cbuild,cinstall,ctest} /usr/bin/

required:
    - rustc

recommended:
    - libssh2
