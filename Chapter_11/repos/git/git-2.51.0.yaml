package:
    name: git
    version: 2.51.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.kernel.org/pub/software/scm/git/git-2.51.0.tar.xz
      md5: 594c03134a0830c70a49e974d6ee35be
    - url: https://www.kernel.org/pub/software/scm/git/git-manpages-2.51.0.tar.xz
      md5:
    - url: https://www.kernel.org/pub/software/scm/git/git-htmldocs-2.51.0.tar.xz
      md5:

build: |
    ./configure --prefix=/usr --with-gitconfig=/etc/gitconfig \
        --with-libpcre2 --with-python=python3 &&
    make

check: |
    GIT_UNZIP=nonexist make test -k |& tee test.log

install: |
    make perllibdir=/usr/lib/perl5/5.42/site_perl install

final: |
    ${YSRC}/install-gitdoc.sh &&
    grep '^not ok' test.log | grep -v TODO || true

recommended:
    - curl
optional:
    - apache
    - fcron
    - gnupg
    - openssh
    - subversion
    - tk
    - valgrind
    - io-socket-ssl
    - systemd-pam
    - linux-pam
    - xmlto
    - asciidoc

