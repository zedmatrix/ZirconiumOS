description: "an open-source, multi-format linear/matrix barcode image processing library."

package:
  name: zxing-cpp
  version: 3.1.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://github.com/zxing-cpp/zxing-cpp/releases/download/v3.1.0/zxing-cpp-3.1.0.tar.gz
    sha256: a3eb825154f05242283e7d94d8ebdcf95beb3a534eba393cce504e91c9b215bd
    md5: 8c1610d08a273df3963edcae7cdcfad3

prepare: |
  cmake -B build -G Ninja -W no-dev -D CMAKE_INSTALL_PREFIX=/usr \
    -D CMAKE_BUILD_TYPE=Release -D ZXING_C_API=OFF -D ZXING_EXAMPLES=OFF \
    -D ZXING_WRITERS=BOTH

build: |
  ninja -C build

install: |
  ninja -C build install

final: |
  ${YBLD}/ydest-strip-x64.sh

required:
  - cmake
  - ninja
