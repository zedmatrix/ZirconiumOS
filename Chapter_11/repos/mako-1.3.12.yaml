description: "A Python module that implements hyperfast and lightweight templating for the Python platform."

package:
  name: mako
  version: 1.3.12
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://files.pythonhosted.org/packages/source/M/Mako/mako-1.3.12.tar.gz
    sha256: 9f778e93289bd410bb35daadeb4fc66d95a746f0b75777b942088b7fd7af550a
    md5: 92390c7e8897e69da67a593a96e88c71

build: |
  pip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir $PWD

install: |
  pip3 install --no-index --find-links dist --no-user Mako

optional:
  - pytest
