description: " Pluggable Authentication Modules used by the local system administrator to control how application programs authenticate users."

package:
  name: linux-pam
  version: 1.7.2
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://github.com/linux-pam/linux-pam/releases/download/v1.7.2/Linux-PAM-1.7.2.tar.xz
    sha256: 3d86b6383fb5fd9eb9578d2cd47d92801191f4bf3f9bc61419bfefc8aa1e531a
    md5: 934c26eca3fada956356a30489e86291
  - url: https://anduin.linuxfromscratch.org/BLFS/Linux-PAM/Linux-PAM-1.7.2-docs.tar.xz
    sha256: 13c178da4dc258708468be33b86d8e5fa0883ee202a48b2e61823c30ff340f31
    md5: 8b0c69931e4805ee5c297192c46d0e28

prepare: |
  sed -e "s/'elinks'/'lynx'/" -e "s/'-no-numbering', '-no-references'/ \
          '-force-html', '-nonumbers', '-stdin'/" -i meson.build &&
  meson setup build --prefix=/usr --buildtype=release -D docdir=/usr/share/doc/Linux-PAM-${PKGVER}

build: |
  ninja -C build

check: |
  ${YPKG}/linux-pam_test.sh;
  ninja -C build test;
  rm -fv /etc/pam.d/other

install: |
  ninja -C build install;
  chmod -v 4755 /usr/sbin/unix_chkpwd

final: |
  tar -C / -xf ${YSRC}/Linux-PAM-${PKGVER}-docs.tar.xz;
  ${YPKG}/linux-pam_config.sh

optional:
  - libnsl
  - libtirpc
  - rpcsvc-proto
  - docbook5-xml
  - docbook-xsl-ns
  - fop
  - libxslt
  - lynx
