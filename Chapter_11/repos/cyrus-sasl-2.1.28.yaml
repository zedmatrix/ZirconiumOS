description: "contains a Simple Authentication and Security Layer implementation, a method for adding authentication support to connection-based protocols."

package:
  name: cyrus-sasl
  version: 2.1.28
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://github.com/cyrusimap/cyrus-sasl/releases/download/cyrus-sasl-2.1.28/cyrus-sasl-2.1.28.tar.gz
    sha256: 7ccfc6abd01ed67c1a0924b353e526f1b766b21f42d4562ee635a8ebfc5bb38c
    md5: 6f228a692516f5318a64505b46966cfa

patches:
  - url: https://www.linuxfromscratch.org/patches/downloads/cyrus-sasl/cyrus-sasl-2.1.28-gcc15_fixes-1.patch
    sha256: 361310425a4a8f19e5f9479f682cc042f191450f2bb6e8bd8d9fb80b6052197e
    md5: 6f228a692516f5318a64505b46966cfa

prepare: |
  autoreconf -fiv &&
  sed '/saslint/a #include <time.h>' -i lib/saslutil.c;
  sed '/plugin_common/a #include <time.h>' -i plugins/cram.c

build: |
  ./configure --prefix=/usr --sysconfdir=/etc --enable-auth-sasldb --with-dblib=lmdb \
    --with-dbpath=/var/lib/sasl/sasldb2 --with-sphinx-build=no --with-saslauthd=/var/run/saslauthd &&
  make -j1

install: |
  make install;
  mkdir -pv ${DESTDIR}/usr/share/doc/cyrus-sasl-${PKGVER}/html;
  install -m644 saslauthd/LDAP_SASLAUTHD ${DESTDIR}/usr/share/doc/cyrus-sasl-${PKGVER};
  install -m644 doc/legacy/*.html ${DESTDIR}/usr/share/doc/cyrus-sasl-${PKGVER}/html

final: |
  /ybuild/ydest-strip-x64.sh
  install -vdm700 /var/lib/sasl

recommended:
  - lmdb

optional:
  - linux-pam
  - mitkrb
  - mariadb
  - openldap
  - postgresql
  - sphinx
