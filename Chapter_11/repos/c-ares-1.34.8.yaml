description: "Is a C library for asynchronous DNS requests."

package:
  name: c-ares
  version: 1.34.8
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://github.com/c-ares/c-ares/releases/download/v1.34.8/c-ares-1.34.8.tar.gz
    sha256: c222b6d681096f9444d2c4863d2c1174019e27cacca0a4a5c114d36dd7d7bf78
    md5: a0568780ffe1476160a6bbb4b6737261

prepare: |
  cmake -B build -G Ninja -D CMAKE_INSTALL_PREFIX=/usr

build: |
  ninja -C build

install: |
  ninja -C build install

final: |
  ${YBLD}/ydest-strip-x64.sh

required:
  - cmake
  - ninja
