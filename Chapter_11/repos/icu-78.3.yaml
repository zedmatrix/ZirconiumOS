description: "International Components for Unicode (ICU) package is a mature, widely used set of C/C++ libraries providing Unicode and Globalization support for software applications."

package:
  name: icu
  version: 78.3
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://github.com/unicode-org/icu/releases/download/release-78.3/icu4c-78.3-sources.tgz
    sha256: 3a2e7a47604ba702f345878308e6fefeca612ee895cf4a5f222e7955fabfe0c0
    md5: a7b736b570ef0e180c96a31715a00c78

prepare: |
  cd source;
  ./configure --prefix=/usr

build: |
  cd source;
  make

check: |
  cd source;
  make check

install: |
  cd source;
  make DESTDIR=${DESTDIR} install

final: |
  ${YBLD}/ydest-strip-x64.sh

optional:
  - doxygen
