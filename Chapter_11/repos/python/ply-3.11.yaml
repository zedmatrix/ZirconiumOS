description: "A Python implementation of the common parsing tools 'lex' and 'yacc'."
homepage: "https://pypi.org/project/ply/"

package:
  name: ply
  version: 3.11
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://files.pythonhosted.org/packages/source/p/ply/ply-3.11.tar.gz
    sha256: 00c7c1aaa88358b9c765b6d3000c6eec0ba42abca5351b095321aef446081da3
    md5: 6465f602e656455affcd7c5734c638f8

build: |
  pip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir $PWD

install: |
  pip3 install --no-index --find-links dist --no-user ply
