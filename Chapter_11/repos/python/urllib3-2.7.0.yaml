description: "HTTP library with thread-safe connection pooling, file post."

homepage: "https://pypi.org/project/urllib3/"

package:
  name: urllib3
  version: 2.7.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://files.pythonhosted.org/packages/source/u/urllib3/urllib3-2.7.0.tar.gz
    sha256: 231e0ec3b63ceb14667c67be60f2f2c40a518cb38b03af60abc813da26505f4c
    md5: e79707b798a66c8165c9c441440f4e80

build: |
  pip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir $PWD

install: |
  pip3 install --no-index --find-links dist --no-user urllib3

required:
  - hatch_vcs

optional:
  - pytest
