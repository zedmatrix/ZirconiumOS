description: "Hatch plugin for versioning with your preferred VCS (Version Control Systems)."
homepage: "https://pypi.org/project/hatch-vcs/"

package:
  name: hatch_vcs
  version: 0.5.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://files.pythonhosted.org/packages/source/h/hatch-vcs/hatch_vcs-0.5.0.tar.gz
    sha256: 0395fa126940340215090c344a2bf4e2a77bcbe7daab16f41b37b98c95809ff9
    md5: 9a22a9f7203783e526959d34510a9672

build: |
  pip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir $PWD

install: |
  pip3 install --no-index --find-links dist --no-user hatch_vcs

required:
  - hatchling
  - setuptools_scm

optional:
  - pytest
  - git
