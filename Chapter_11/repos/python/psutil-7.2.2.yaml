description: "Offers many functionalities by classic UNIX command line tools such as ps, top, iotop, lsof, netstat, ifconfig, free."
homepage: "https://pypi.org/project/psutil/"

package:
  name: psutil
  version: 7.2.2
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://files.pythonhosted.org/packages/source/p/psutil/psutil-7.2.2.tar.gz
    sha256: 0746f5f8d406af344fd547f1c8daa5f5c33dbc293bb8d6a16d80b4bb88f59372
    md5: a1c5c30f68a927053be09592d1a4be53

build: |
  pip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir $PWD

install: |
  pip3 install --no-index --find-links dist --no-user psutil

optional:
  - pytest
