description: "A Python module that implements the next generation YAML parser and emitter. "

package:
  name: pyyaml
  version: 6.0.3
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://files.pythonhosted.org/packages/source/P/PyYAML/pyyaml-6.0.3.tar.gz
    sha256: d76623373421df22fb4cf8817020cbb7ef15c725b9d5e45f17e189bfc384190f
    md5: dbc6f815cd75160ccf12e470be1c8d6e

build: |
  pip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir $PWD

install: |
  pip3 install --no-index --find-links dist --no-user PyYAML

required:
  - cython
  - libyaml

optional:
  - pytest
