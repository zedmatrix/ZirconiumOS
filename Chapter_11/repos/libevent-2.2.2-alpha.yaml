description: "A mechanism to execute a callback function when an event occurs on a file descriptor or after timeout has been reached."

package:
  name: libevent
  version: 2.2.2
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://github.com/libevent/libevent/releases/download/release-2.2.2-alpha/libevent-2.2.2-alpha.tar.gz
    sha256: 4ab1b369bcb5af0c5971b8ade4e95a2c1326f6d0dc1ba75d620bf0331c3184a8
    md5: 04c609678aad4a3605c7288905c8ee20

prepare: |
  sed -i 's/python/&3/' event_rpcgen.py;
  ./configure --prefix=/usr --disable-static

build: |
  make

check: |
  make verify || true

install: |
  make DESTDIR=${DESTDIR} install

final: |
  ${YBLD}/ydest-strip-x64.sh

optional:
  - doxygen
