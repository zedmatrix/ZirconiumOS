description: "Contains a modern toolset used for generating Makefiles."
note: "2026-07-09"

package:
  name: cmake
  version: 4.4.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://cmake.org/files/v4.4/cmake-4.4.0.tar.gz
    sha256: 65757f442fdd242e27f1728fc26dc0cba4164f7a0791a5c788631c00080369bc
    md5: f774f921a662a611ef461de965277d23

prepare: |
  sed -i '/"lib64"/s/64//' Modules/GNUInstallDirs.cmake;
  ./bootstrap --prefix=/usr --system-libs --mandir=/share/man  \
    --no-system-jsoncpp --no-system-cppdap --no-system-librhash \
    --docdir=/share/doc/cmake-${PKGVER}

build: |
  make

check: |
  bin/ctest -j$(nproc) || true

install: |
  make DESTDIR=${DESTDIR} install

final: |
  ${YBLD}/ydest-strip-x64.sh

recommended:
  - curl
  - libarchive
  - libuv
  - nghttp2

optional:
  - git
  - qt6
  - gcc-pass3
  - mercurial
  - openjdk
  - subversion
