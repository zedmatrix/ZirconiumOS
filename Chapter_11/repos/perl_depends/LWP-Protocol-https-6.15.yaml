description: "provides https support for LWP::UserAgent (i.e. libwww-perl-6.81)."

homepage: "https://metacpan.org/pod/LWP::Protocol::https"

package:
  name: LWP-Protocol-https
  version: 6.15
  rel: 1
  archive: false
  delete: true
  ycheck: false

sources:
  - url: https://cpan.metacpan.org/authors/id/O/OA/OALDERS/LWP-Protocol-https-6.15.tar.gz
    sha256: 44eec2da147ba0511090871b0ca82f69794376bc31e8c76d1040961ba57f59b8
