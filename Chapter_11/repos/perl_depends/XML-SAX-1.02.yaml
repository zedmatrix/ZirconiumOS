description: "It includes classes and APIs required for implementing SAX drivers, along with a factory class for returning any SAX parser installed on the user's system."

package:
  name: XML-SAX
  version: 1.02
  rel: 1
  archive: false
  delete: true
  ycheck: false

sources:
  - url: https://cpan.metacpan.org/authors/id/G/GR/GRANTM/XML-SAX-1.02.tar.gz
    sha256: 4506c387043aa6a77b455f00f57409f3720aa7e553495ab2535263b4ed1ea12a
    md5:

prepare: |
  yes | perl Makefile.PL

build: |
  make

check: |
  make test

install: |
  make install

required:
  - XML-SAX-Base
  - XML-NamespaceSupport
  - libxml2
