description: "makes using SSL/TLS much easier by wrapping the necessary functionality into the familiar IO::Socket interface and providing secure defaults whenever possible."

homepage: "https://metacpan.org/pod/IO::Socket::SSL"

package:
  name: IO-Socket-SSL
  version: 2.098
  rel: 1
  archive: false
  delete: true
  ycheck: false

sources:
  - url: https://www.cpan.org/authors/id/S/SU/SULLR/IO-Socket-SSL-2.098.tar.gz
    sha256: b38473be20256b1a06447dd6769ad162bfad6a258234ed2c7e2e1819c16c4df7
    md5: d52c3d2dd85bfa22b722f7ae7ba90dc3

prepare: |
  yes | perl Makefile.PL

build: |
  make

check: |
  make test

install: |
  make install

required:
  - make-ca
  - Net-SSLeay

recommended:
  - URI
