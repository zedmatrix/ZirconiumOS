description: "A collection of simple PIN or pass-phrase entry dialogs which utilize the Assuan protocol as described by the Agypten project."

package:
  name: pinentry
  version: 1.3.3
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://www.gnupg.org/ftp/gcrypt/pinentry/pinentry-1.3.3.tar.bz2
    sha256: c2970f16d6afb66ecddfca767d743936c86239bff936eed7fd7597a678414b63
    md5: 59a65644180ac2a43a1235d698515b36

prepare: |
  ./configure --prefix=/usr --enable-pinentry-tty \
    --enable-pinentry-qt=no --enable-pinentry-gnome3=no

build: |
  make

install: |
  make DESTDIR=${DESTDIR} install

final: |
  ${YBLD}/ydest-strip-x64.sh

required:
  - libassuan
  - libgpg-error

optional:
  - emacs
  - fltk
  - gcr3
  - gcr4
  - libsecret
  - kde-frameworks
