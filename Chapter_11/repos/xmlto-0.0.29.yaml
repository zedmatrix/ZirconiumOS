description: "It chooses an appropriate stylesheet for the conversion you want and applies it using an external XSLT processor."
homepage: "https://pagure.io/xmlto/  https://codeberg.org/xmlto/xmlto"

package:
  name: xmlto
  version: 0.0.29
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://pagure.io/xmlto/archive/0.0.29/xmlto-0.0.29.tar.gz
    sha256: 40504db68718385a4eaa9154a28f59e51e59d006d1aa14f5bc9d6fded1d6017a
    md5: 556f2642cdcd005749bd4c08bc621c37

prepare: |
  autoreconf -fiv;
  LINKS="/usr/bin/links" ./configure --prefix=/usr

build: |
  make

check: |
  make check || true

install: |
  make DESTDIR=${DESTDIR} install

final: |
  ${YBLD}/ydest-strip-x64.sh

required:
  - docbook-xml
  - docbook-xsl-nons
  - libxslt

optional:
  - fop
  - links
  - lynx
