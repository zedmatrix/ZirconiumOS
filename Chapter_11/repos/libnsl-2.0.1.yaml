description: "Contains the public client interface for NIS(YP). It replaces the NIS library that used to be in glibc."

package:
  name: libnsl
  version: 2.0.1
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://github.com/thkukuk/libnsl/releases/download/v2.0.1/libnsl-2.0.1.tar.xz
    sha256: 5c9e470b232a7acd3433491ac5221b4832f0c71318618dc6aa04dd05ffcd8fd9
    md5: fb178645dfa85ebab0f1e42e219b42ae

prepare: |
  ./configure --sysconfdir=/etc --disable-static

build: |
  make

install: |
  make install

final: |
  /ybuild/ydest-strip-x64.sh

required:
  - libtirpc
