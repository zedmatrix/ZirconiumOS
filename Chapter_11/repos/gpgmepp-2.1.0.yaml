description: "Provides a C++ wrapper to gpgme-2.0.1."


package:
  name: gpgmepp
  version: 2.1.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://www.gnupg.org/ftp/gcrypt/gpgmepp/gpgmepp-2.1.0.tar.xz
    sha256: 57f804468f0204504b172c6b139cb05124b4263be7ad514932c7c4c5062a16e2
    md5: f3252524ba34c6a42455f30e226de1f5

prepare: |
  cmake -B build -G Ninja -D CMAKE_INSTALL_PREFIX=/usr

build: |
  ninja -C build

install: |
  ninja -C build install

final: |
  ${YBLD}/ydest-strip-x64.sh

required:
  - cmake
  - gpgme

recommended:
  - ninja
