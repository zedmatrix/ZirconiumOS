description: "A library used to enforce strong passwords by comparing user selected passwords to words in chosen word lists."
note: "Dec 23, 2024"

package:
  name: cracklib
  version: 2.10.3
  rel: 1
  archive: false
  delete: true
  cflags: ""
  ycheck: false
  destdir: true

sources:
  - url: https://github.com/cracklib/cracklib/releases/download/v2.10.3/cracklib-2.10.3.tar.xz
    sha256: 1d1b83676b5673051b9373e1ca0db81c1fa88faf9a195a3c1af984fd9c250d66
    md5: e8ea2b86de774fc09fdd0f2829680b19
  - url: https://github.com/cracklib/cracklib/releases/download/v2.10.3/cracklib-words-2.10.3.xz
    sha256: b3d1e0e0ae9bc7ffed65c0042d7c68bdb903368aa6b918f94572453c6ea874dc
    md5: f27804022dbf2682a7f7c353317f9a53

prepare: |
  ./configure --prefix=/usr --disable-static --with-default-dict=/usr/lib/cracklib/pw_dic

build: |
  make

install: |
  make DESTDIR=${DESTDIR} install

final: |
  ${YPKG}/cracklib-config.sh;
  /ybuild/ydest-strip-x64.sh;
  create-cracklib-dict /usr/share/dict/cracklib-words /usr/share/dict/cracklib-extra-words
