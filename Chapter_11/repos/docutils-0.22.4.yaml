description: "A set of Python modules and programs for processing plaintext docs into formats such as HTML, XML, or LaTeX."

package:
  name: docutils
  version: 0.22.4
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://files.pythonhosted.org/packages/source/d/docutils/docutils-0.22.4.tar.gz
    sha256: 4db53b1fde9abecbb74d91230d32ab626d94f6badfc575d6db9194a49df29968
    md5: 58f718cd60a87725d4dac56ae427c9f8

build: |
  pip3 wheel -w dist --no-build-isolation --no-deps --no-cache-dir $PWD

install: |
  pip3 install --no-index --find-links dist --no-user docutils
