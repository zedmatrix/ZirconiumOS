apply_patches: |
  patch -Np1 -i ../chromium-145-fix-SYS_SECCOMP.patch
  patch -Np1 -i ../chromium-147-rust-1.95-bytemuck.patch
  patch -Np1 -i ../chromium-149-drop-unknown-clang-flag.patch
  patch -Np1 -i ../chromium-149-unbundle-minizip-undo-unicode.patch
  patch -Np1 -i ../chromium-149-use-of-undeclared-identifier-ERROR.patch
  patch -Np1 -i ../chromium-nodejs-version.patch
  patch -Np1 -i ../use-oauth2-client-switches-as-default.patch
  patch -Np1 -i ../chromium-149-build-with-wasm-rollup.patch

prepare: |
  ./chromium-prepare.sh

build: |
  ./chromium-localflags.sh
  gn gen out/Release --args="${_flags[*]}"
  ninja -j1 -C out/Release chrome chrome_sandbox chromedriver.unstripped

install: |
  cd chromium-launcher-8
  make PREFIX=/usr DESTDIR=${DESTDIR} install
  cd ../
  ./chromium-install.sh

final: |
  /ybuild/ydest-strip-x64.sh;
  unset CC CXX AR NM _flags _system_libs _unwanted_bundled_libs _google_api_key

required:
  - alsa-lib
  - at-spi2-core
  - cairo
  - dbus
  - desktop-file-utils
  - expat
  - glib2
  - glibc
  - gtk3'
  - hicolor-icon-theme
  - libcups
  - libffi
  - libgcrypt
  - pulseaudio
  - libva
  - libX11
  - libxcb
  - libXcomposite
  - libXdamage
  - libXext
  - libXfixes
  - libxkbcommon
  - libXrandr
  - mesa
  - nspr
  - nss
  - pango
  - pciutils
  - systemd
  - liberation-fonts
  - xdg-utils
  - zlib

recommended:
  - minizip
  - openh264

optional:
  - gn
