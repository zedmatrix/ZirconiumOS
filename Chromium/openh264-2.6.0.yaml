description: "H.264 encoder and decoder"

package:
  name: openh264
  version: 2.6.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://github.com/cisco/openh264/archive/v2.6.0/openh264-2.6.0.tar.gz
    sha256: 558544ad358283a7ab2930d69a9ceddf913f4a51ee9bf1bfb9e377322af81a69
    md5: 0b01f0279eca1c7bb65395ea350fa85c

build: |
  make

install: |
  make PREFIX=/usr install-shared
  install -vDm755 h264{dec,enc} -t /usr/bin

required:
  - nasm

recommended:
  - clang
