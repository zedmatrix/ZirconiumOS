package:
    name: libXtst
    version: 1.2.5
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/lib/libXtst-1.2.5.tar.xz
      md5: b62dc44d8e63a67bb10230d54c44dcb7

prepare: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \
    --disable-static --docdir=/usr/share/doc/libXtst-1.2.5

build: |
    make

install: |
    make install

required:
    - fontconfig
    - libxcb
    - dbus
optional:
    - asciidoc
    - xmlto
    - fop
    - links
    - lynx
