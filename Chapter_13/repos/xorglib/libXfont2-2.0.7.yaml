package:
    name: libXfont2
    version: 2.0.7
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/lib/libXfont2-2.0.7.tar.xz
      md5: 66e03e3405d923dfaf319d6f2b47e3da

prepare: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \
    --disable-static --disable-devel-docs --docdir=/usr/share/doc/libXfont2-2.0.7

build: |
    make

install: |
    make install

required:
    - fontconfig
    - libxcb
    - dbus
optional:
    - asciidoc
    - xmlto
    - fop
    - links
    - lynx
