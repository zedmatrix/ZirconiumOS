package:
    name: libXcursor
    version: 1.2.3
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/lib/libXcursor-1.2.3.tar.xz
      md5: 5ce55e952ec2d84d9817169d5fdb7865

prepare: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \
    --disable-static --docdir=/usr/share/doc/libXcursor-1.2.3

build: |
    make

install: |
    make install

required:
    - fontconfig
    - libxcb
    - dbus
optional:
    - asciidoc
    - xmlto
    - fop
    - links
    - lynx
