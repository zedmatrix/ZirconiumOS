package:
    name: libXpm
    version: 3.5.17
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/lib/libXpm-3.5.17.tar.xz
      md5: 05b5667aadd476d77e9b5ba1a1de213e

prepare: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \
    --disable-static --disable-open-zfile --docdir=/usr/share/doc/libXpm-3.5.17

build: |
    make

install: |
    make install

required:
    - fontconfig
    - libxcb
    - dbus
optional:
    - asciidoc
    - xmlto
    - fop
    - links
    - lynx
