package:
    name: libfontenc
    version: 1.1.8
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/lib/libfontenc-1.1.8.tar.xz
      md5: 8816cc44d06ebe42e85950b368185826

prepare: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \
    --disable-static --docdir=/usr/share/doc/libfontenc-1.1.8

build: |
    make

install: |
    make install

required:
    - fontconfig
    - libxcb
    - dbus
optional:
    - asciidoc
    - xmlto
    - fop
    - links
    - lynx
