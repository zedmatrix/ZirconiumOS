package:
    name: gobject-introspection
    version: 1.84.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://download.gnome.org/sources/gobject-introspection/1.84/gobject-introspection-1.84.0.tar.xz
      md5: 2a62fb1c584616a8ebcd9dd4d045f27e

prepare: |
    meson setup ybuild  --prefix=/usr --buildtype=release

build: |
    ninja -C ybuild

install: |
    ninja -C ybuild install


required:
    - glib2-pass1
    - docutils
    - libxslt
    - pcre2

optional:
    - cairo
    - dbus
    - fuse
    - gdb
    - gjs
    - gtk-doc
    - docbook-xml
    - docbook-xsl-nons
    - gi-docgen
    - glib-networking
    - mako
