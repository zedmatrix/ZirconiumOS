package:
    name: xkill
    version: 1.0.6
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/app/xkill-1.0.6.tar.xz
      md5: f62b99839249ce9a7a8bb71a5bab6f9d

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var &&
    make

install: |
    make install

required:
    - libpng
    - mesa
    - xbitmaps
    - xcb-util

optional:
    - linux-pam

order: 018
