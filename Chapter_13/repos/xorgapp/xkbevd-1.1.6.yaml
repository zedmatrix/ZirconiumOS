package:
    name: xkbevd
    version: 1.1.6
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/app/xkbevd-1.1.6.tar.xz
      md5: 543c0535367ca30e0b0dbcfa90fefdf9

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var &&
    make

install: |
    make install

required:
    - libpng
    - mesa
    - xbitmaps
    - xcb-util

optional:
    - linux-pam

order: 016
