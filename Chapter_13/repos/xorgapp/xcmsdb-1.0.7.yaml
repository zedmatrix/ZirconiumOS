package:
    name: xcmsdb
    version: 1.0.7
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/app/xcmsdb-1.0.7.tar.xz
      md5: 37063ccf902fe3d55a90f387ed62fe1f

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var &&
    make

install: |
    make install

required:
    - libpng
    - mesa
    - xbitmaps
    - xcb-util

optional:
    - linux-pam

order: 007
