package:
    name: xlsclients
    version: 1.1.5
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/app/xlsclients-1.1.5.tar.xz
      md5: ab4b3c47e848ba8c3e47c021230ab23a

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var &&
    make

install: |
    make install

required:
    - libpng
    - mesa
    - xbitmaps
    - xcb-util

optional:
    - linux-pam

order: 020
