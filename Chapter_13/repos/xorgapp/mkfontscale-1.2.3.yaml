package:
    name: mkfontscale
    version: 1.2.3
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/app/mkfontscale-1.2.3.tar.xz
      md5: 7dcf5f702781bdd4aaff02e963a56270

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var &&
    make

install: |
    make install

required:
    - libpng
    - mesa
    - xbitmaps
    - xcb-util

optional:
    - linux-pam

order: 002
