package:
    name: setxkbmap
    version: 1.3.4
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/app/setxkbmap-1.3.4.tar.xz
      md5: 1d61c9f4a3d1486eff575bf233e5776c

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var &&
    make

install: |
    make install

required:
    - libpng
    - mesa
    - xbitmaps
    - xcb-util

optional:
    - linux-pam

order: 004
