package:
    name: polkit
    version: 126
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/polkit-org/polkit/archive/126/polkit-126.tar.gz
      md5: db4ce0a42d5bf8002061f8e34ee9bdd0

prepare: |
    groupadd -fg 27 polkitd &&
    useradd -c "PolicyKit Daemon Owner" -d /etc/polkit-1 -u 27 -g polkitd -s /bin/false polkitd &&
    meson setup ybuild --prefix=/usr --buildtype=release -D man=true \
      -D session_tracking=logind -D tests=true

build: |
    ninja -C ybuild

install: |
    ninja -C ybuild install

required:
    - duktape
    - glib2

recommended:
    - libxslt
    - linux-pam

optional:
    - gtk-doc
    - dbusmock
