package:
    name: xkeyboard-config
    version: 2.45
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/data/xkeyboard-config/xkeyboard-config-2.45.tar.xz
      md5: cebc84ec99d3273e07aee8ecff3e3519

prepare: |
    meson setup ybuild --prefix=/usr --buildtype=release

build: |
    ninja -C ybuild

install: |
    ninja -C ybuild install

required:
    - xkbcomp
    - libxslt
    - meson
    - ninja

optional:
    - libxkbcommon
    - pytest
