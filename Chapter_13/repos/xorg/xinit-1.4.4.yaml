package:
    name: xinit
    version: 1.4.4
    rel: 1
    archive: false
    delete:

sources:
    - url: https://www.x.org/pub/individual/app/xinit-1.4.4.tar.xz
      md5: e7430a710261c9129b1280f26cb159a5

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var \
    --disable-static --with-xinitdir=/etc/X11/app-defaults &&
    make

install: |
    make install

required:
    - twm
    - xclock
    - xterm
    - libX11
    - util-macros
    - xauth
    - xmodmap
    - xrdb
