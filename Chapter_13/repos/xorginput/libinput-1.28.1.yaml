package:
    name: libinput
    version: 1.28.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.28.1/libinput-1.28.1.tar.gz
      md5: 34988f66b52814647c01fa72f2c5210d

prepare: |
    meson setup ybuild --prefix=/usr --buildtype=release -D debug-gui=false \
      -D tests=false -D libwacom=false -D udev-dir=/usr/lib/udev

build: |
    ninja -C ybuild

install: |
    ninja -C ybuild install

required:
    - libevdev
    - mtdev

optional:
    - valgrind
    - gtk3
    - libunwind
    - libwacom
    - doxygen
    - graphviz
    - recommonmark
    - pytest
    - pyparsing
    - sphinx_rtd_theme
