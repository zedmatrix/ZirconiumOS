package:
    name: xf86-input-evdev
    version: 2.11.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/driver/xf86-input-evdev-2.11.0.tar.xz
      md5: faa89be0ef86aebd6fd0a03eed23839c

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static && make

install: |
    make install

required:
    - libevdev
    - mtdev
    - xorg-server
    - xorgproto
