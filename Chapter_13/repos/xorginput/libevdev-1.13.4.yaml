package:
    name: libevdev
    version: 1.13.4
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.freedesktop.org/software/libevdev/libevdev-1.13.4.tar.xz
      md5: 2e8a4665e332699ccba7ee54a0dd189a

prepare: |
    meson setup ybuild --prefix=/usr --buildtype=release -D documentation=disabled -D tests=disabled

build: |
    ninja -C ybuild

install: |
    ninja -C ybuild install

required:
    - meson

recommended:
    - glibc

optional:
    - doxygen
    - valgrind
