package:
    name: xf86-input-libinput
    version: 1.5.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/driver/xf86-input-libinput-1.5.0.tar.xz
      md5: f8d0fb6987d843e688d597c2b66ec824

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static &&
    make

check: |
    make check

install: |
    make install

required:
    - libinput
    - xorg-server
    - libXi
    - libX11
