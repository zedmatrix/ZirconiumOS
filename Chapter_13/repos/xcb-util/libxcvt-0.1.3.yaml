package:
    name: libxcvt
    version: 0.1.3
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/lib/libxcvt-0.1.3.tar.xz
      md5: 7fb9c51d33a680f724f34da41768b1d0

prepare: |
    meson setup ybuild --prefix=/usr --buildtype=release

build: |
    ninja -C ybuild

install: |
    ninja -C ybuild install

required:
    - glibc
    - meson
