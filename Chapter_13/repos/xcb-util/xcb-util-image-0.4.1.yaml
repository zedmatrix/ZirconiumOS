package:
    name: xcb-util-image
    version: 0.4.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://xcb.freedesktop.org/dist/xcb-util-image-0.4.1.tar.xz
      md5: a67bfac2eff696170259ef1f5ce1b611

prepare: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static

build: |
    make

install: |
    make install

required:
    - libxcb
    - xcb-util
