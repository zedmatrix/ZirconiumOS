package:
    name: xcb-util-wm
    version: 0.4.2
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://xcb.freedesktop.org/dist/xcb-util-wm-0.4.2.tar.xz
      md5: 581b3a092e3c0c1b4de6416d90b969c3

prepare: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var --disable-static

build: |
    make

install: |
    make install

required:
    - libxcb
    - xcb-util
