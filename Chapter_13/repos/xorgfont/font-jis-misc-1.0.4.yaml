package:
    name: font-jis-misc
    version: 1.0.4
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/font/font-jis-misc-1.0.4.tar.xz
      md5: 2c939d5bd4609d8e284be9bef4b8b330

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var &&
    make

install: |
    make install

required:
    - bdftopcf
    - util-macros
    - mkfontscale
    - font-util
