package:
    name: font-misc-misc
    version: 1.1.3
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/font/font-misc-misc-1.1.3.tar.xz
      md5: 145128c4b5f7820c974c8c5b9f6ffe94

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var &&
    make

install: |
    make install

required:
    - bdftopcf
    - util-macros
    - mkfontscale
    - font-util
