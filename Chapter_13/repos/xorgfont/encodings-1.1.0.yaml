package:
    name: encodings
    version: 1.1.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/font/encodings-1.1.0.tar.xz
      md5: a56b1a7f2c14173f71f010225fa131f1

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var &&
    make

install: |
    make install

required:
