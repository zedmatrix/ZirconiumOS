package:
    name: font-isas-misc
    version: 1.0.4
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://www.x.org/pub/individual/font/font-isas-misc-1.0.4.tar.xz
      md5: fe2c44307639062d07c6e9f75f4d6a13

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --localstatedir=/var &&
    make

install: |
    make install

required:
    - bdftopcf
    - util-macros
    - mkfontscale
    - font-util
