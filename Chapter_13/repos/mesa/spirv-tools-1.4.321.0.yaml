package:
    name: spirv-tools
    version: 1.4.321.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/KhronosGroup/SPIRV-Tools/archive/vulkan-sdk-1.4.321.0/SPIRV-Tools-vulkan-sdk-1.4.321.0.tar.gz
      md5: bd91a34dcbd8301cba5f4fa9524c7d9f

prepare: |
    cmake -B Ybuild -D CMAKE_INSTALL_PREFIX=/usr -D CMAKE_BUILD_TYPE=Release -G Ninja \
        -D SPIRV_WERROR=OFF -D BUILD_SHARED_LIBS=ON -D SPIRV_TOOLS_BUILD_STATIC=OFF  \
        -D SPIRV-Headers_SOURCE_DIR=/usr

build: |
    ninja -C Ybuild

install: |
    ninja -C Ybuild install

required:
    - cmake
    - spirv-headers
