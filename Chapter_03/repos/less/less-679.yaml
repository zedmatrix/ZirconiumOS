package:
    name: less
    version: 679
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://mirror.csclub.uwaterloo.ca/gnu/less/less-679.tar.gz
      md5: 0386dc14f6a081a94dfb4c2413864eed

build: |
    ./configure --prefix=/usr --sysconfdir=/etc &&
    make

install: |
    make install

required:
    - inetutils
