package:
    name: make-temp
    version: 4.4.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://mirror.csclub.uwaterloo.ca/gnu/make/make-4.4.1.tar.gz
      md5: c8469a3713cbbe04d955d4ae4be23eeb

build: |
    ./configure --prefix=/usr --host=$LFS_TGT --build=$(build-aux/config.guess) &&
    make

install: |
    make DESTDIR=$LFS install
