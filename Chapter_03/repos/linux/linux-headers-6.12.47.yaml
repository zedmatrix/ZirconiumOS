package:
    name: linux-headers
    version: 6.12.47
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.47.tar.xz
      md5: c3b62721a4ed32df1eaa0b624fa6ac9c

prepare: |
    make mrproper

build: |
    make headers

install: |
    find usr/include -type f ! -name '*.h' -delete &&
    cp -rv usr/include $LFS/usr
