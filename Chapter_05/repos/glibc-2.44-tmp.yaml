description: "The main C library provides basic routines."

package:
  name: glibc-tmp
  version: 2.44
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/glibc/glibc-2.44.tar.xz
    sha256: 37f600f2bef3c5e8300147059568b2a2e40a7ad6ccc65ce942556d49429cc667
    md5: 7677da43ef759c68e005f5d4c37986a6

patches:
  - url: https://www.linuxfromscratch.org/patches/downloads/glibc/glibc-fhs-1.patch
    sha256: 643552db030e2f2d7ffde4f558e0f5f83d3fabf34a2e0e56ebdb49750ac27b0d
    md5: 9a5997c3452909b1769918c759eff8a2

prepare: |
  ln -sfv ../lib/ld-linux-x86-64.so.2 $YLFS/lib64
  ln -sfv ../lib/ld-linux-x86-64.so.2 $YLFS/lib64/ld-lsb-x86-64.so.3
  mkdir -v build && cd build;
  echo "rootsbindir=/usr/sbin" > configparms

build: |
  cd build;
  ../configure --prefix=/usr libc_cv_slibdir=/usr/lib \
    --build=$(../scripts/config.guess) --enable-kernel=5.10 \
    --host=$YTARGET --disable-nscd --with-pkgversion="Zirconium ${PKGVER}" &&
  make

install: |
  cd build;
  make DESTDIR=$YLFS install;
  sed '/RTLDLIST=/s@/usr@@g' -i $YLFS/usr/bin/ldd

requires:
  - binutils-p1
  - gcc-p1
  - linux-headers
