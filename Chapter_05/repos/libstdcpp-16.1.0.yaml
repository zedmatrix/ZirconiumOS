description: "Libstdc++ is the standard C++ library needed to compile C++ code."
note: ""

package:
  name: libstdcpp
  version: 16.1.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/gcc/gcc-16.1.0/gcc-16.1.0.tar.xz
    sha256: 50efb4d94c3397aff3b0d61a5abd748b4dd31d9d3f2ab7be05b171d36a510f79
    md5: 9b016416f8e2dce4a0ef8759d1936446

prepare: |
  mkdir -v build && cd build
  ../libstdc++-v3/configure --prefix=/usr --host=$YTARGET --build=$(../config.guess) \
    --disable-nls --disable-multilib --disable-libstdcxx-pch \
    --with-gxx-include-dir=/tools/$YTARGET/include/c++/${PKGVER}

build: |
  cd build &&
  make

install: |
  cd build &&
  make DESTDIR=$YLFS install
  rm -v $YLFS/usr/lib/lib{stdc++{,exp,fs},supc++}.la

required:
  - binutils-p1
  - gcc-p1
  - linux-headers
  - glibc-tmp
