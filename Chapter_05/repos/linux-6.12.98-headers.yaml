description: "Expose the kernels API for use by Glibc."

package:
  name: linux-headers
  version: 6.12.98
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.12.98.tar.xz
    sha256: a62b6a2d207ff72510e5f47156b7078e1e71797357412411b8e4fff97fc8f4c7
    md5: e3c368d5ecb37a5371b7c91775a7e45b

prepare: |
  make mrproper

build: |
  make headers
  find usr/include -type f ! -name '*.h' -delete

install: |
  cp -rv usr/include $YLFS/usr
