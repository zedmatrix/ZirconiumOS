description: "Expose the kernels API for use by Glibc."

package:
  name: linux-headers
  version: 6.6.145
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.6.145.tar.xz
    sha256: de100e33d8ad8b6f4b3d2335b179e961be3c00ae7a39efdb052182a8d8bf0126
    md5: 95085853927186f94c88826420c785eb

prepare: |
  make mrproper

build: |
  make headers
  find usr/include -type f ! -name '*.h' -delete

install: |
  cp -rv usr/include $YLFS/usr
