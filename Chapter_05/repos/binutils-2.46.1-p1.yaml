description: "The Binutils package contains a linker, an assembler, and other tools for handling object files."

package:
  name: binutils-p1
  version: 2.46.1
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://sourceware.org/pub/binutils/releases/binutils-2.46.1.tar.xz
    sha256: e127a709cba24c76de8936cb7083dd768f28cd37eb010492e2f19b71eb1294e4
    md5: 9b9b73791519bf6fc8d76c7fc9fd32fe

prepare: |
  mkdir -v build && cd build;
  ../configure --prefix=$YLFS/tools --with-sysroot=$YLFS --target=$YTARGET \
    --disable-nls --enable-gprofng=no --disable-werror \
    --enable-new-dtags  --enable-default-hash-style=gnu

build: |
  cd build && make

install: |
  cd build && make install

note: "Sat Jul 11 16:10:56 UTC 2026"
