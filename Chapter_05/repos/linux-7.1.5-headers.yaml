description: "Expose the kernels API for use by Glibc."
note: "Wed Jul 22 11:43:08 PDT 2026"

package:
  name: linux-headers
  version: 7.1.5
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.1.5.tar.xz
    sha256: 22a0196b3cbcdf34dc27b77561f4d040585fd3447edc9ab3531a1ac79e3041e7
    md5: 75f719d50ea10e0bb623a95f468600cb

prepare: |
  make mrproper

build: |
  make headers
  find usr/include -type f ! -name '*.h' -delete

install: |
  cp -rv usr/include $YLFS/usr
