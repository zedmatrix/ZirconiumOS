package:
    name: freetype2-pass1
    version: 2.14.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://downloads.sourceforge.net/freetype/freetype-2.14.0.tar.xz
      md5: 6fc21ca4dcabcb8a4d643877585b3028
    - url: https://downloads.sourceforge.net/freetype/freetype-doc-2.14.0.tar.xz
      md5: 809cb7b52b90f1611aa740375e4dbff9

prepare: |
    tar -xf $YSRC/freetype-doc-2.14.0.tar.xz --strip-components=2 -C docs &&
    sed -ri "s:.*(AUX_MODULES.*valid):\1:" modules.cfg &&
    sed -r "s:.*(#.*SUBPIXEL_RENDERING) .*:\1:" -i include/freetype/config/ftoption.h

build: |
    ./configure --prefix=/usr --without-harfbuzz \
    --enable-freetype-config --disable-static &&
    make

install: |
    make install

final: |
    cp -v -R docs -T /usr/share/doc/freetype-2.14.0 &&
    rm -v /usr/share/doc/freetype-2.14.0/freetype-config.1

required:
    - libpng
    - which
optional:
    - harfbuzz
    - brotli
    - librsvg
