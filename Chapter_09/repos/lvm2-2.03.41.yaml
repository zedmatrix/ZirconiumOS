description: "The LVM2 package is a set of tools that manage logical partitions."
note: "2026-05-15 11:30"

package:
  name: lvm2
  version: 2.03.41
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://sourceware.org/ftp/lvm2/LVM2.2.03.41.tgz
    sha256: d58011b845df8ec13816ca13ea6c39d4cb3d038cd2d7d387acdf5681ad7d6637
    md5: 9696ce3b3844db1d90dae457f83b0306

prepare: |
  ./configure --prefix=/usr --enable-cmdlib --enable-pkgconfig --enable-udev_sync

build: |
  make

install: |
  make DESTDIR=${DESTDIR} install
  rm -fv ${DESTDIR}/usr/lib/udev/rules.d/69-dm-lvm.rules

final: |
  ${YBLD}/ydest-strip-x64.sh

required:
  - libaio
  - systemd
  - which

optional:
  - libnvme
  - mdadm
  - valgrind
  - xfsprogs
