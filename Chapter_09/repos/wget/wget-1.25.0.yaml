package:
    name: wget
    version: 1.25.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://mirror.csclub.uwaterloo.ca/gnu/wget/wget-1.25.0.tar.gz
      md5: c70ba58b36f944e8ba1d655ace552881

build: |
    ./configure --prefix=/usr --sysconfdir=/etc --with-ssl=openssl &&
    make

install: |
    make install

required:
    - libpsl
    - make-ca

optional:
    - gnutls
    - libidn2
    - libproxy
    - valgrind
    - http-daemon
    - io-socket-ssl
