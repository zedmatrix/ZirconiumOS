package:
    name: curl
    version: 8.15.0
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://curl.se/download/curl-8.15.0.tar.xz
      md5: b8872bb6cc5d18d03bea8ff5090b2b81

build: |
    ./configure --prefix=/usr --with-openssl --with-ca-path=/etc/ssl/certs &&
    make

install: |
    make install

recommended:
    - libpsl

optional:
    - make-ca
    - brotli
    - c-ares
    - gnutls
    - libidn2
    - libssh2
    - mitkrb5
    - nghttp2
    - openldap
    - samba
    - apache
    - stunnel
    - openssh
    - valgrind
