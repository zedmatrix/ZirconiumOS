description: "The LVM2 package is a set of tools that manage logical partitions."

package:
  name: lvm2
  version: 2.03.41
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://sourceware.org/ftp/lvm2/LVM2.2.03.41.tgz
    sha256: d58011b845df8ec13816ca13ea6c39d4cb3d038cd2d7d387acdf5681ad7d6637
    md5: 9696ce3b3844db1d90dae457f83b0306

prepare: |
  ./configure --prefix=/usr --enable-cmdlib --enable-pkgconfig --enable-udev_sync

build: |
  make

check: |
  make -C tools install_tools_dynamic;
  make -C udev install;
  make -C libdm install;
  LC_ALL=en_US.UTF-8 make check_local

install: |
  make install &&
  rm -fv /usr/lib/udev/rules.d/69-dm-lvm.rules

required:
  - libaio
  - which

optional:
  - libnvme
  - mdadm
  - valgrind
  - xfsprogs
