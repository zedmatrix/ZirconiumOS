description: "Package contains various utilities for use with the FAT family of file systems."

package:
  name: dosfstools
  version: 4.2
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://github.com/dosfstools/dosfstools/releases/download/v4.2/dosfstools-4.2.tar.gz
    sha256: 64926eebf90092dca21b14259a5301b7b98e7b1943e8a201c7d726084809b527
    md5: 49c8e457327dc61efab5b115a27b087a

prepare: |
  ./configure --prefix=/usr --enable-compat-symlinks --mandir=/usr/share/man \
    --docdir=/usr/share/doc/dosfstools-${PKGVER}

build: |
  make

check: |
  make check || true

install: |
  make DESTDIR=${DESTDIR} install

final: |
  ${YBLD}/ydest-strip-x64.sh
