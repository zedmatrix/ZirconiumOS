description: "An asynchronous I/O facility (async I/O) that has a richer API and capability set than the simple POSIX facility."

package:
  name: libaio
  version: 0.3.113
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://pagure.io/libaio/archive/libaio-0.3.113/libaio-0.3.113.tar.gz
    sha256: 1c561c20670c5c09cc8437a622008c0693c6a7816c1f30332da3796953b2f454
    md5: 605237f35de238dfacc83bcae406d95d

build: |
  sed -i '/install.*libaio.a/s/^/#/' src/Makefile &&
  make

install: |
  make DESTDIR=${DESTDIR} install

final: |
  ${YBLD}/ydest-strip-x64.sh
