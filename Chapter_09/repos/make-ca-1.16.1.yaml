description: "Public Key Infrastructure (PKI) is a method to validate the authenticity of an otherwise unknown entity across untrusted networks."

package:
  name: make-ca
  version: 1.16.1
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: false

sources:
  - url: https://github.com/lfs-book/make-ca/archive/v1.16.1/make-ca-1.16.1.tar.gz
    sha256: 98c7e6fded1938b972d0177b5d5e925d318be87f84ee9e4cad680656a8c29414
    md5: bf9cea2d24fc5344d4951b49f275c595

build: |
  sed '/mktemp/s/-t //' -i make-ca;
  make install &&
  install -vdm755 /etc/ssl/local

install: |
  /usr/sbin/make-ca -g

required:
  - libtasn1
  - p11-kit

optional:
  - nss
