package:
    name: libpsl
    version: 0.21.5
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/rockdaboot/libpsl/releases/download/0.21.5/libpsl-0.21.5.tar.gz
      md5: 870a798ee9860b6e77896548428dba7b

prepare: |
    meson setup Ybuild --prefix=/usr --buildtype=release

build: |
    ninja -C Ybuild

install: |
    ninja -C Ybuild install

required:
    - libidn2
    - libunistring

optional:
    - icu
    - libidn
    - valgrind
    - gtk-doc
