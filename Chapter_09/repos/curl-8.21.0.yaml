description: "The cURL package contains a utility and a library used for transferring files with URL syntax"
note: "2026-06-24"

package:
  name: curl
  version: 8.21.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://curl.se/download/curl-8.21.0.tar.xz
    sha256: aa1b66a70eace83dc624508745646c08ae561de512ab403adffb93ac87fc72e6
    md5: 230131079987135cbe1eadb77a04af57

prepare: |
  ./configure --prefix=/usr --disable-static --with-openssl --with-ca-path=/etc/ssl/certs

build: |
  make

install: |
  make DESTDIR=${DESTDIR} install;
  rm -rf docs/examples/.deps;
  find docs \( -name Makefile\* -o -name \*.1 -o -name \*.3 -o -name CMakeLists.txt \) -delete

final: |
  mkdir -pv ${DESTDIR}/usr/share/doc/curl-${PKGVER};
  cp -R docs -T ${DESTDIR}/usr/share/doc/curl-${PKGVER}
  ${YBLD}/ydest-strip-x64.sh

recommended:
  - libpsl
  - make-ca

optional:
  - brotli
  - c-ares
  - gnutls
  - libidn2
  - libssh2
  - mitkrb5
  - nghttp2
  - openldap
  - samba
  - apache
  - stunnel
  - openssh
  - valgrind
