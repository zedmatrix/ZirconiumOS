description: "A set of programs for listing PCI devices, inspecting their status and setting their configuration registers."
note: "2026-04-05 21:28"

package:
  name: pciutils
  version: 3.15.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://mj.ucw.cz/download/linux/pci/pciutils-3.15.0.tar.gz
    sha256: a42e6e3f76fb6b1f6ac2e08cdd151f6bf78bc4f6312c591f4b6ec197582ede3a
    md5: 20b8e936cce9784444961088c8801f68

prepare: |
  sed -r '/INSTALL/{/PCI_IDS|update-pciids /d; s/update-pciids.8//}' -i Makefile

build: |
  make PREFIX=/usr SHAREDIR=/usr/share/hwdata SHARED=yes

install: |
  make PREFIX=/usr SHAREDIR=/usr/share/hwdata SHARED=yes DESTDIR=${DESTDIR} install install-lib;
  chmod -v 755 ${DESTDIR}/usr/lib/libpci.so

final: |
  ${YBLD}/ydest-strip-x64.sh

required:
  - hwdata
