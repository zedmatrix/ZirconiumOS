description: "libtasn1 is a highly portable C library that encodes and decodes DER/BER data following an ASN.1 schema."

package:
  name: libtasn1
  version: 4.21.0
  rel: 1
  archive: false
  delete: true
  ycheck: false
  destdir: true

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/libtasn1/libtasn1-4.21.0.tar.gz
    sha256: 1d8a444a223cc5464240777346e125de51d8e6abf0b8bac742ac84609167dc87
    md5: 2ee1d9f3aa66f1e308c46a283aa9a8c2

prepare: |
  ./configure --prefix=/usr --disable-static

build: |
  make

install: |
  make DESTDIR=${DESTDIR} install

final: |
  ${YBLD}/ydest-strip-x64.sh

optional:
  - gtk-doc
  - valgrind
