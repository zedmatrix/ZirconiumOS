package:
    name: libcupsfilters
    version: 2.1.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/OpenPrinting/libcupsfilters/releases/download/2.1.1/libcupsfilters-2.1.1.tar.xz
      md5: 1e3144c242e7ddcee112d41c79266885

build: |
    ./configure --prefix=/usr --disable-static --disable-ghostscript \
        --docdir=/usr/share/doc/libcupsfilters-2.1.1 &&
    make

check: |
    make check

install: |
    make install

required:
    - cups
    - glib2
    - mupdf
    - lcms2
    - poppler
    - qpdf

recommended:
    - dejavu-fonts-ttf
    - libexif
    - libjpeg-turbo
    - libpng
    - libtiff

optional:
    - ghostscript
