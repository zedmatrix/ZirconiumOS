package:
    name: libppd
    version: 2.1.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/OpenPrinting/libppd/releases/download/2.1.1/libppd-2.1.1.tar.xz
      md5: 65accc86f9956a1160937b14e0f516a6

build: |
    ./configure --prefix=/usr --disable-static --with-cups-rundir=/run/cups \
        --disable-ghostscript --enable-ppdc-utils --docdir=/usr/share/doc/libppd-2.1.1 &&
    make

check: |
    make check

install: |
    make install

required:
    - libcupsfilters
