package:
    name: rust-bindgen
    version: 0.72.1
    rel: 1
    archive: false
    delete: true

sources:
    - url: https://github.com/rust-lang/rust-bindgen/archive/refs/tags/v0.72.1/rust-bindgen-0.72.1.tar.gz
      md5: 49be3303557d072ce4c6987b2989be3c

build: |
    cargo build --release

install: |
    install -v -m755 target/release/bindgen /usr/bin

final: |
    bindgen --generate-shell-completions bash > /usr/share/bash-completion/completions/bindgen;
    bindgen --generate-shell-completions zsh  > /usr/share/zsh/site-functions/_bindgen

required:
    - rustc
    - llvm
